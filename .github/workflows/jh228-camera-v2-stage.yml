name: JH228 Secure Camera Example Stage (candidate)
on:
  push:
    branches:
      - jh228-camera-v2-secure-stage-20261121
    paths:
      - "jh-server/camera-v2-secure-stage.mjs"
      - "jh-server/camera-v2-secure-stage.test.mjs"
      - "jh-server/server.mjs"
      - "jh-server/owner-setup/deployment/jh228-camera-v2-durable-overlay*.mjs"
      - "jh-server/owner-setup/deployment/jh228-camera-v2-candidate-entry.mjs"
      - "jh-server/owner-setup/deployment/published-host-router.mjs"
      - "jh-server/owner-setup/kabiseo-camera-v0256/camera-goal.mjs"
      - "jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-goal-policy*.mjs"
      - "jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-verified-host-ports*.mjs"
      - "jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-durable-once-journal*.mjs"
      - "jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-current-turn-pipeline*.mjs"
      - "jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-chatgpt-native-image-ports*.mjs"
      - "jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-chatgpt-native-capture-flow*.mjs"
      - "jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-no-paid-api-contract.test.mjs"
      - ".github/workflows/jh228-camera-v2-stage.yml"
  pull_request:
    branches:
      - jh-fix3-secure-server
jobs:
  scoped-image-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check production server
        run: node --check jh-server/server.mjs
      - name: Syntax check default published router and opt-in candidate
        run: |
          node --check jh-server/owner-setup/deployment/published-host-router.mjs
          node --check jh-server/owner-setup/deployment/jh228-camera-v2-candidate-entry.mjs
      - name: Secure56 one-shot JPEG regression
        run: node --test jh-server/camera-v2-secure-stage.test.mjs
      - name: Install exact existing durable-host dependencies (no lifecycle scripts)
        run: |
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Existing camera-goal and JH228 protocol compatibility
        run: node --test jh-server/owner-setup/kabiseo-camera-v0256/camera-goal.test.mjs jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-goal-policy.test.mjs
      - name: Trusted GPT LEFT display and Secure56 session-to-stage binding
        run: node --test jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-verified-host-ports.test.mjs
      - name: Persistent SQLite one-shot command replay and restart protection
        run: node --test jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-durable-once-journal.test.mjs
      - name: Current-turn JH verified full image handoff (synthetic ports)
        run: node --test jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-current-turn-pipeline.test.mjs
      - name: First-party ChatGPT ImageGen reference and artifact port (mocked native platform only)
        run: node --test jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-chatgpt-native-image-ports.test.mjs
      - name: Native-only image-generation to signed camera APPLY composition (synthetic platform)
        run: node --test jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-chatgpt-native-capture-flow.test.mjs
      - name: No paid REST provider exists in this camera candidate
        run: node --test jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-no-paid-api-contract.test.mjs
      - name: Verified durable runtime overlay and sealed source regression
        run: node --test jh-server/owner-setup/deployment/jh228-camera-v2-durable-overlay.test.mjs
      - name: Independent 100-process security regression
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            node --test jh-server/camera-v2-secure-stage.test.mjs jh-server/owner-setup/deployment/jh228-camera-v2-durable-overlay.test.mjs jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-goal-policy.test.mjs jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-verified-host-ports.test.mjs jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-durable-once-journal.test.mjs jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-current-turn-pipeline.test.mjs jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-chatgpt-native-image-ports.test.mjs jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-chatgpt-native-capture-flow.test.mjs jh-server/owner-setup/kabiseo-camera-v0256/camera-v2-no-paid-api-contract.test.mjs >/dev/null
          done
          echo "JH228_NO_PAID_API_NATIVE_CAPTURE_100_PASS"

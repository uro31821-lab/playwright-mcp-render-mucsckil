name: JH Stage63 native-select owner evidence isolated verification

on:
  push:
    branches:
      - fix/stage62-select-pick-owner-popup-evidence-20261104

permissions:
  contents: read

jobs:
  verify-stage63-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_ENV: test
      JH_OWNER_DEFER_LISTEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reviewed dependencies
        run: |
          set -euo pipefail
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund --package-lock=false
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: Prepare reviewed Stage63 candidate
        run: |
          set -euo pipefail
          ref=origin/fix/stage63-native-select-owner-admission-20261104
          for n in 00 01 02; do git show "$ref:.stage63-payload/part-$n"; done > /tmp/stage63.b64
          base64 --decode /tmp/stage63.b64 > /tmp/stage63.gz
          test "$(sha256sum /tmp/stage63.gz | cut -d' ' -f1)" = a2cd7beeaab74c72e2f9f7049dd56d7c36d4ea04f15faaaf820757eb52af66ab
          mkdir -p /tmp/stage63
          gzip -dc /tmp/stage63.gz | tar -x -C /tmp/stage63 --no-same-owner --no-same-permissions
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/stage63/jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs')
          s=p.read_text()
          start_marker="assert.ok(helper.indexOf('if(action===\"SELECT_OPEN\")jhStage61PreparedPick56.delete(routeToken);')<"
          end_marker="'every re-open clears stale prepared refs before receipt inspection');"
          start=s.find(start_marker)
          end=s.find(end_marker,start)
          if start<0 or end<0:
              raise SystemExit('STAGE63_ORDER_ASSERT_ANCHOR_MISSING')
          end+=len(end_marker)
          replacement="""const afterAction=helper.slice(helper.indexOf('async function jhStage61AfterAction56'));
           const staleClear=afterAction.indexOf('if(action===\"SELECT_OPEN\")jhStage61PreparedPick56.delete(routeToken);');
           const receiptRead=afterAction.indexOf('const record=await jhStage61Host56.record({routeToken');
           assert.ok(staleClear>=0&&receiptRead>staleClear,
            'every re-open clears stale prepared refs before receipt inspection');"""
          s=s[:start]+replacement+s[end:]
          pattern=r"(\s*JH_STAGE44_DEVICE_FOCUS:'EXPLICIT_SIGNED_WORKFLOW_FOCUS_V1'),\s*\n\s*JH_MOBILE13_COMMAND_DIAGNOSTICS:'EXPLICIT_OWNER_DEVICE_READ_ONLY_V1'};"
          s,n=re.subn(pattern,r"\1};",s,count=1)
          if n!=1:
              raise SystemExit('STAGE63_OPTIONAL_DIAGNOSTIC_ANCHOR_MISSING')
          p.write_text(s)
          PY
          node --check /tmp/stage63/jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs
          node --check /tmp/stage63/jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs
      - name: Run isolated source and regression tests
        run: |
          set -euo pipefail
          PATCH=/tmp/stage63/jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs
          TEST=/tmp/stage63/jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs
          apply_candidate() {
            git reset --hard "$GITHUB_SHA" >/dev/null
            cp "$PATCH" jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs
            cp "$TEST" jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs
          }
          run_one() {
            apply_candidate
            echo "=== ISOLATED: $1 ==="
            node --test --test-concurrency=1 --test-reporter=spec "$1"
          }
          run_one jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs
          run_one jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.test.mjs
          run_one jh-server/owner-setup/jh168-mobile-unification/stage40-owner-admission-diagnostics.test.mjs
          run_one jh-server/owner-setup/jh168-mobile-unification/stage41-command-lifecycle.test.mjs
          run_one jh-server/owner-setup/jh168-mobile-unification/stage44-device-focus.test.mjs
          run_one jh-server/owner-setup/jh168-mobile-unification/mobile13-command-diagnostics.test.mjs
          run_one jh-server/owner-setup/jh168-mobile-unification/stage38-generated-operator.test.mjs
          run_one jh-server/owner-setup/jh168-mobile-unification/mobile13-action-policy.test.mjs
          run_one jh-server/owner-setup/jh168-mobile-unification/mobile13-integrated-contract.test.mjs
          run_one jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-host-adapter.test.mjs
      - name: No release boundary
        if: always()
        run: |
          echo RENDER_DEPLOY=0
          echo APK_BUILD=0
          echo APK_INSTALL=0
          echo PHONE_ACTION=0

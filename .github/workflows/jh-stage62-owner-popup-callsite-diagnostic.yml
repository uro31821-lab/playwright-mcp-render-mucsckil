name: JH Stage63 native-select owner evidence source review

on:
  push:
    branches:
      - fix/stage62-select-pick-owner-popup-evidence-20261104

permissions:
  contents: read

jobs:
  inspect-stage63-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decode and print bounded reviewed source
        run: |
          set -euo pipefail
          ref=origin/fix/stage63-native-select-owner-admission-20261104
          for n in 00 01 02; do git show "$ref:.stage63-payload/part-$n"; done | base64 --decode | gzip -dc > /tmp/stage63.tar
          mkdir /tmp/stage63 && tar -xf /tmp/stage63.tar -C /tmp/stage63 --no-same-owner --no-same-permissions
          echo '=== TEST SOURCE ==='
          nl -ba /tmp/stage63/jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs | sed -n '1,280p'
          echo '=== PATCH FUNCTION TAIL ==='
          nl -ba /tmp/stage63/jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs | sed -n '285,390p'
      - name: No release boundary
        if: always()
        run: |
          echo RENDER_DEPLOY=0
          echo APK_BUILD=0
          echo APK_INSTALL=0
          echo PHONE_ACTION=0

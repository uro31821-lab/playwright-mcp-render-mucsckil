name: JH Stage62 owner popup evidence review

on:
  push:
    branches:
      - fix/stage62-select-pick-owner-popup-evidence-20261104

permissions:
  contents: read

jobs:
  inspect-stage63-review-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decode existing Stage63 review payload without execution
        run: |
          set -euo pipefail
          ref=origin/fix/stage63-native-select-owner-admission-20261104
          for n in 00 01 02; do git show "$ref:.stage63-payload/part-$n"; done > /tmp/stage63.b64
          base64 --decode /tmp/stage63.b64 > /tmp/stage63.gz
          echo '=== PAYLOAD FILE TYPE ==='
          file /tmp/stage63.gz
          echo '=== PAYLOAD SHA256 ==='
          sha256sum /tmp/stage63.gz
          echo '=== GZIP CONTENT TYPE ==='
          gzip -dc /tmp/stage63.gz > /tmp/stage63.payload
          file /tmp/stage63.payload
          echo '=== SAFE ARCHIVE LIST OR TEXT HEAD ==='
          if tar -tf /tmp/stage63.payload >/tmp/stage63.list 2>/dev/null; then
            cat /tmp/stage63.list
          else
            sed -n '1,240p' /tmp/stage63.payload
          fi
      - name: No release boundary
        if: always()
        run: |
          echo RENDER_DEPLOY=0
          echo APK_BUILD=0
          echo APK_INSTALL=0
          echo PHONE_ACTION=0

name: JH Stage63 generated-runtime prerequisite diagnostic

on:
  push:
    branches:
      - fix/stage62-select-pick-owner-popup-evidence-20261104

permissions:
  contents: read

jobs:
  diagnose-stage63-generated-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: test
      JH_OWNER_DEFER_LISTEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reviewed dependencies
        run: |
          set -euo pipefail
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund --package-lock=false
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: Prepare instrumented reviewed candidate
        run: |
          set -euo pipefail
          ref=origin/fix/stage63-native-select-owner-admission-20261104
          for n in 00 01 02; do git show "$ref:.stage63-payload/part-$n"; done | base64 --decode > /tmp/stage63.gz
          test "$(sha256sum /tmp/stage63.gz | cut -d' ' -f1)" = a2cd7beeaab74c72e2f9f7049dd56d7c36d4ea04f15faaaf820757eb52af66ab
          mkdir -p /tmp/stage63
          gzip -dc /tmp/stage63.gz | tar -x -C /tmp/stage63 --no-same-owner --no-same-permissions
          cp /tmp/stage63/jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs
          cp /tmp/stage63/jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          test=Path('jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs')
          s=test.read_text()
          start_marker="assert.ok(helper.indexOf('if(action===\"SELECT_OPEN\")jhStage61PreparedPick56.delete(routeToken);')<"
          end_marker="'every re-open clears stale prepared refs before receipt inspection');"
          start=s.find(start_marker);end=s.find(end_marker,start)
          if start<0 or end<0: raise SystemExit('STAGE63_ORDER_ASSERT_ANCHOR_MISSING')
          end+=len(end_marker)
          replacement="""const afterAction=helper.slice(helper.indexOf('async function jhStage61AfterAction56'));
           const staleClear=afterAction.indexOf('if(action===\"SELECT_OPEN\")jhStage61PreparedPick56.delete(routeToken);');
           const receiptRead=afterAction.indexOf('const record=await jhStage61Host56.record({routeToken');
           assert.ok(staleClear>=0&&receiptRead>staleClear,
            'every re-open clears stale prepared refs before receipt inspection');"""
          s=s[:start]+replacement+s[end:]
          pattern=r"(\s*JH_STAGE44_DEVICE_FOCUS:'EXPLICIT_SIGNED_WORKFLOW_FOCUS_V1'),\s*\n\s*JH_MOBILE13_COMMAND_DIAGNOSTICS:'EXPLICIT_OWNER_DEVICE_READ_ONLY_V1'};"
          s,n=re.subn(pattern,r"\1};",s,count=1)
          if n!=1: raise SystemExit('STAGE63_OPTIONAL_DIAGNOSTIC_ANCHOR_MISSING')
          test.write_text(s)
          patch=Path('jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs')
          p=patch.read_text()
          old="""    !source.includes('const cuSchema56={'))fail('STAGE61_MOBILE_RUNTIME_PREREQUISITES_MISSING');"""
          new="""    !source.includes('const cuSchema56={')){console.error('STAGE61_PREREQ_FLAGS '+JSON.stringify({
      isString:typeof source==='string',follow:source.includes('async function jhMobileWebFollow56('),
      read:source.includes('async function jhMobileWebRead56('),secure:source.includes('function secureCall56('),
      schema:source.includes('const cuSchema56={'),already:source.includes('const jhStage61Host56=createStage61HostAdapter('),
      length:source.length}));fail('STAGE61_MOBILE_RUNTIME_PREREQUISITES_MISSING');}"""
          if old not in p: raise SystemExit('STAGE61_PREREQ_DIAGNOSTIC_ANCHOR_MISSING')
          patch.write_text(p.replace(old,new,1))
          PY
      - name: Run focused generated-runtime diagnostic
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-reporter=spec \
            jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs
      - name: No release boundary
        if: always()
        run: |
          echo RENDER_DEPLOY=0
          echo APK_BUILD=0
          echo APK_INSTALL=0
          echo PHONE_ACTION=0

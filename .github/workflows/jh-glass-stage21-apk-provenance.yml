name: G Glass Stage21 Read-Only Real APK Identity Inspection
on:
  push:
    branches:
      - feature/jh-glass-photo-mailbox-20261110
    paths:
      - '.github/workflows/jh-glass-stage21-apk-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-apk-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout development-only source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Stage official Meta source and exact isolated G Glass patch
        shell: bash
        run: |
          set -euo pipefail
          git init "${RUNNER_TEMP}/dat"
          git -C "${RUNNER_TEMP}/dat" remote add origin https://github.com/meta/meta-wearables-dat-android.git
          git -C "${RUNNER_TEMP}/dat" fetch --depth=1 origin f4371bc9f90249d51eb07d7f8a61e8d829294f16
          git -C "${RUNNER_TEMP}/dat" checkout --detach FETCH_HEAD
          test "$(git -C "${RUNNER_TEMP}/dat" rev-parse HEAD)" = f4371bc9f90249d51eb07d7f8a61e8d829294f16
          base="jh-server/owner-setup/glass-bridge/android_cameraaccess"
          app="${RUNNER_TEMP}/dat/samples/CameraAccess"
          python3 -m unittest discover -q -s "$base" -p 'test_stage14_voice_patch.py'
          python3 -m unittest discover -q -s "$base" -p 'test_stage16_isolated_trial.py'
          python3 "$base/apply_handsfree_probe.py" "$app"
          python3 "$base/isolate_stage16_voice_trial.py" "$app"
          grep -Fq 'applicationId = "com.koreanlifehub.jhglassprobe"' "$app/app/build.gradle.kts"
          test "$(git -C "${RUNNER_TEMP}/dat" rev-parse HEAD)" = f4371bc9f90249d51eb07d7f8a61e8d829294f16
          echo GGLASS21_PINNED_OFFICIAL_SOURCE_AND_ISOLATED_ID_PASS
      - name: Build isolated test candidate only
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/dat/samples/CameraAccess"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:processDebugMainManifest
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo GGLASS21_REAL_SDK_TEST_CANDIDATE_COMPILE_PASS
      - name: Read actual APK package, permissions and debug certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="${RUNNER_TEMP}/dat/samples/CameraAccess/app/build/outputs/apk/debug/app-debug.apk"
          stage20="jh-server/owner-setup/glass-bridge/physical-trial/stage20_apk_identity.py"
          test -f "$stage20"
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT2="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt2 | sort -V | tail -1)"
          APKSIGNER="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT2" && test -x "$APKSIGNER"
          test -s "$apk"
          sha256sum "$apk" | awk '{ print "GGLASS21_TEST_APK_SHA256=" $1 }'
          "$AAPT2" dump badging "$apk" | sed -n '/^package:/p;/^application-label:/p;/^uses-permission:/p;/^application-debuggable/p' | head -45
          # Keep inspection local, show only cert labels/public digests and scheme facts.
          "$APKSIGNER" verify --verbose --print-certs "$apk" > "${RUNNER_TEMP}/gglass21_apksigner.txt" 2>&1
          grep -Ei '(Verified|Signer|certificate)' "${RUNNER_TEMP}/gglass21_apksigner.txt" || true
          set +e
          python3 "$stage20" --apk "$apk" --aapt2 "$AAPT2" --apksigner "$APKSIGNER" \
            --output "${RUNNER_TEMP}/gglass21_readonly.json" > /dev/null
          rc=$?
          set -e
          python3 - "${RUNNER_TEMP}/gglass21_readonly.json" "$rc" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert sys.argv[2] == '12', 'Preflight must block when owner-approved certificate absent'
          assert r['status'] == 'BLOCKED', r
          assert r['installation_authorized'] is False
          assert r.get('package_name') == 'com.koreanlifehub.jhglassprobe', r
          assert r.get('label') == 'G Glass', r
          assert r.get('signer_count') == 1, r
          assert r.get('candidate_sha256'), r
          assert 'PREAPPROVED_SIGNER_FINGERPRINT_MISSING' in r['reasons'], r
          assert not r['unknown_permissions'], r
          print('GGLASS21_ACTUAL_APK_MANIFEST_AND_SIGNATURE_READBACK_PASS')
          print('GGLASS21_INSTALLATION_BLOCKED_UNAPPROVED_CI_DEBUG_SIGNER')
          PY
      - name: No APK distribution or hardware change
        shell: bash
        run: |
          echo GGLASS21_NO_APK_ARTIFACT_UPLOAD_NO_INSTALL_NO_JH_DEPLOY_NO_META_WDC_WRITE_NO_GPT_API_CALL

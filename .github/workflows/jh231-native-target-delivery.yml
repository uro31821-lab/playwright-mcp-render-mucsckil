name: JH231 native target delivery review

on:
  push:
    branches: ['fix/jh231-native-target-delivery-20261123']
    paths:
      - 'jh-dev-tools/windows-delivery/jh231/**'
      - '.github/workflows/jh231-native-target-delivery.yml'

permissions:
  contents: read

concurrency:
  group: jh231-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-delivery:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Require Windows PowerShell 5.1
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          $PSVersionTable.PSVersion.ToString()
      - name: Validate exact scripts and harmless delivery scenarios
        run: |
          & './jh-dev-tools/windows-delivery/jh231/tests/Test-JH231Delivery.ps1' -KitRoot './jh-dev-tools/windows-delivery/jh231/delivery'
          if (-not $?) { throw 'JH231 delivery regressions failed' }

      - name: Verify live progress before harmless child exit
        run: |
          & './jh-dev-tools/windows-delivery/jh231/tests/Test-JH231Progress.ps1' -KitRoot './jh-dev-tools/windows-delivery/jh231/delivery'
          if (-not $?) { throw 'JH231 real child progress regression failed' }
      - name: Verify read-only recovery observer
        run: |
          & './jh-dev-tools/windows-delivery/jh231/recovery/tests/Test-JH231ReadStatus.ps1' -KitRoot './jh-dev-tools/windows-delivery/jh231/recovery/delivery'
          if (-not $?) { throw 'JH231 read-only recovery regressions failed' }

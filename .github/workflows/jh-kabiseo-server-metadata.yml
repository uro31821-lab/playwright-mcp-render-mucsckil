name: JH Kabiseo server metadata candidate
on:
  pull_request:
    paths:
      - 'host-kabiseo-assist/server/**'
      - '.github/workflows/jh-kabiseo-server-metadata.yml'
permissions: {contents: read}
jobs:
  metadata-producer-and-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false, path: candidate}
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          path: baseline
          ref: 0663e0c3b434f300803e5cf272609032a5e519d3
      - name: Node builtin-only producer regression tests (no phone or network)
        run: |
          node --version
          node --test --test-reporter=spec candidate/host-kabiseo-assist/server/metadata-producer.test.mjs
      - name: Compose against existing reviewed runtime without starting server
        env:
          KABISEO_BASELINE_COMMIT: 0663e0c3b434f300803e5cf272609032a5e519d3
        run: node candidate/host-kabiseo-assist/server/compose-review.mjs baseline "$RUNNER_TEMP/kabiseo-server-review"
      - name: Preserve review evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kabiseo-server-review-${{ github.run_id }}
          path: ${{ runner.temp }}/kabiseo-server-review/server-composition-result.json
          if-no-files-found: error
          retention-days: 7

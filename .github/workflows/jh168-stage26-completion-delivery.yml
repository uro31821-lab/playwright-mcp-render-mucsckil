name: JH168 Stage26 signed completion ACK review (no device writes)
on:
  push:
    branches: ['feat/jh168-stage26-completion-delivery-idempotent-20261101']
  pull_request:
    branches: ['jh-fix3-secure-server']
permissions:
  contents: read
jobs:
  signed-completion-ack-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Preserve production router, signed Secure56 executor and Android policy
        run: |
          git diff --exit-code origin/jh-fix3-secure-server -- \
            jh-server/server.mjs \
            jh-server/owner-setup/deployment \
            jh-server/owner-setup/server-integration \
            jh-server/owner-setup/android-direct \
            jh-server/owner-setup/trusted-server \
            ':(exclude)jh-server/owner-setup/deployment/durable-native-host.mjs' \
            ':(exclude)jh-server/owner-setup/deployment/jh167-article-operational-review-composition.mjs' \
            ':(exclude)jh-server/owner-setup/deployment/jh167-connection-v2-assembled-preflight.test.mjs'

      # The host exclusion above requires exact three-edit reversal, pinned SHA and upstream byte equality here.
      - name: Verify exact mobile composition, three host edits and reviewed legacy click-test contract
        run: node --test --test-reporter=spec jh-server/owner-setup/jh168-mobile-unification/mobile-web-current-main-compat.test.mjs
      - name: Pinned existing dependencies without scripts
        run: |
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund --package-lock=false
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: Test original HMAC, exact original job result and zero-click replay
        env:
          CI: 'true'
          NODE_ENV: test
          JH_OWNER_DEFER_LISTEN: '1'
        run: |
          node --check jh-server/owner-setup/jh168-mobile-unification/stage26-completion-delivery-policy.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/stage26-completion-delivery-patch.mjs
          node --test --test-reporter=spec \
            jh-server/owner-setup/jh168-mobile-unification/stage26-completion-delivery.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/split-followup-receipts.test.mjs \
            jh-server/owner-setup/server-integration/pending-approval-receipt-patch.test.mjs
      - name: Review only, never restart live service or click phone
        run: |
          echo JH168_STAGE26_SOURCE_REVIEW_ONLY


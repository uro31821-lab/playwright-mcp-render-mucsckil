name: JH Ebiseo 0.5.8 expired trust cancellation
on:
  push:
    branches: ['fix/ebiseo058-expired-trust-cancel-20261108']
permissions:
  contents: write
jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[ebiseo058-server-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: true, fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - name: Apply exact server retention and regression delta
        run: |
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
          node jh-dev-tools/ebiseo058/apply-expired-trust-cancel.mjs --write
          node jh-dev-tools/ebiseo058/apply-expired-trust-cancel.mjs --check
          git diff --check
          git add \
            jh-server/owner-setup/owner-enrollment/owner-registry-service.mjs \
            jh-server/owner-setup/owner-enrollment/permanent-trust-revocation.test.mjs \
            jh-dev-tools/ebiseo058/apply-expired-trust-cancel.mjs
          git rm .github/workflows/jh-ebiseo058-generate-expired-trust-fix.yml
          git diff --cached --quiet && { echo EXPECTED_EBISEO058_DELTA_MISSING; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix expired finite trust cancellation [ebiseo058-server-generated]'
          git push origin HEAD:fix/ebiseo058-expired-trust-cancel-20261108

name: JH167 Connection V2 guarded integration
on:
  pull_request:
    branches: [jh-fix3-secure-server]
    paths:
      - '.github/workflows/jh167-connection-v2-ci.yml'
      - 'jh-server/owner-setup/connection-v2/**'
      - 'jh-server/owner-setup/deployment/jh167-connection-v2-*.mjs'
      - 'jh-server/owner-setup/deployment/jh167-split-lifecycle-policy.mjs'
      - 'jh-server/owner-setup/deployment/durable-native-job-policy.mjs'
      - 'jh-server/verification/jh167-split-lifecycle-safe.test.mjs'
      - 'jh-server/verification/durable-computer-policy.test.mjs'
      - 'jh-server/owner-setup/deployment/jh167-article-operational-review-composition.mjs'
      - 'jh-server/owner-setup/deployment/jh167-right-pane-orchestrator-repair.mjs'
      - 'jh-server/owner-setup/deployment/jh167-web-service-names.test.mjs'
      - 'jh-server/owner-setup/deployment/durable-native-host.mjs'
      - 'jh-server/owner-setup/deployment/durable-native-job-policy.mjs'
      - 'jh-server/verification/jh167-exact-right-click-durable.test.mjs'
      - 'jh-server/owner-setup/deployment/jh167-open-completion*.mjs'
      - 'jh-server/verification/jh167-open-completion-http.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-connect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: JavaScript parse of read-only V2 and durable adapter
        run: |
          node --check jh-server/owner-setup/deployment/jh167-connection-v2-runtime.mjs
          node --check jh-server/owner-setup/deployment/durable-native-host.mjs
          node --check jh-server/owner-setup/deployment/jh167-article-operational-review-composition.mjs
          node --check jh-server/owner-setup/deployment/jh167-right-pane-orchestrator-repair.mjs
      - name: Install exact runtime dependencies for compiled startup verification
        run: |
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund --package-lock=false
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: Original V2 + real assembled operational startup regressions
        run: node --test jh-server/owner-setup/connection-v2/*.test.mjs jh-server/owner-setup/deployment/jh167-connection-v2-runtime.test.mjs jh-server/owner-setup/deployment/jh167-connection-v2-assembled-preflight.test.mjs jh-server/owner-setup/deployment/jh167-right-url-routing.test.mjs jh-server/verification/jh167-exact-right-click-durable.test.mjs jh-server/owner-setup/deployment/jh167-web-service-names.test.mjs
      - name: OPEN completion new module syntax and pinned auth fixture
        run: |
          node --check jh-server/owner-setup/deployment/jh167-open-completion.mjs
          node --check jh-server/owner-setup/deployment/jh167-open-completion.test.mjs
          node --check jh-server/verification/jh167-open-completion-http.test.mjs
          (cd jh-server && node verification/build-auth-candidate.mjs)
      - name: OPEN completion full regression including signed local Secure56 HTTP (no real phone)
        run: |
          node --test --test-concurrency=1 \
            jh-server/owner-setup/deployment/jh167-open-completion.test.mjs \
            jh-server/owner-setup/deployment/jh167-connection-v2-assembled-preflight.test.mjs \
            jh-server/owner-setup/deployment/jh167-right-url-routing.test.mjs \
            jh-server/owner-setup/deployment/jh167-web-service-names.test.mjs \
            jh-server/owner-setup/deployment/jh167-connection-v2-runtime.test.mjs \
            jh-server/owner-setup/deployment/readback-budget.test.mjs \
            jh-server/verification/job-deadline.test.mjs \
            jh-server/verification/right-pane-open-route.test.mjs \
            jh-server/owner-setup/trusted-server/dispatch-receipts.test.mjs \
            jh-server/verification/jh167-open-completion-http.test.mjs
      - name: Validate exact SAVE_ANALYSIS and FINISH durable admission
        run: |
          node --check jh-server/owner-setup/deployment/jh167-split-lifecycle-policy.mjs
          node --check jh-server/owner-setup/deployment/durable-native-job-policy.mjs
          node --test --test-concurrency=1 jh-server/verification/jh167-split-lifecycle-safe.test.mjs jh-server/verification/durable-computer-policy.test.mjs

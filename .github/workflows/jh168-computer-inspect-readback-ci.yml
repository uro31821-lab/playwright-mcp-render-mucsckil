name: JH168 Computer Use original inspect readback
on:
  push:
    branches: ['feat/jh168-phone-input-scroll-20261031']
  pull_request:
    branches: ['jh-fix3-secure-server']
permissions:
  contents: read
jobs:
  original-inspect-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Preserve the original Secure56 authorization policy and original transport
        run: |
          git diff --exit-code 484a85a0104af421e9fc9cc80a3eb99361afe937 -- \
            jh-server/server.mjs \
            jh-server/owner-setup/server-integration/server.mjs \
            jh-server/owner-setup/deployment \
            jh-server/owner-setup/trusted-server
      - name: Install original signed owner dependencies without scripts
        run: |
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund --package-lock=false
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: Read-only original Computer Use INSPECT receipt and authenticated startup tests
        run: |
          node --check jh-server/owner-setup/jh168-mobile-unification/computer-inspect-receipts.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/computer-inspect-receipt-patch.mjs
          CI=true NODE_ENV=test JH_OWNER_DEFER_LISTEN=1 node --test --test-reporter=spec --test-concurrency=1 \
            jh-server/owner-setup/jh168-mobile-unification/computer-inspect-receipts.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/split-read-receipts.test.mjs \
            jh-server/owner-setup/server-integration/pending-approval-operator-entry.test.mjs \
            jh-server/owner-setup/server-integration/pending-approval-receipt-patch.test.mjs \
            jh-server/verification/durable-computer-policy.test.mjs
      - name: Preserve original operator opt-out and fail-closed routing
        run: |
          node --test --test-reporter=spec jh-server/owner-setup/deployment/published-host-router-pending-approval.test.mjs
      - name: No new approval authority, runtime launch or device write
        run: |
          test -z "${JH_PENDING_APPROVAL_OPERATOR_ENABLE:-}"
          test -z "${RENDER_SERVICE_ID:-}"
          echo JH168_ORIGINAL_COMPUTER_INSPECT_READBACK_ONLY

name: JH167 Android Stage4 R5 contract audit — isolated
on:
  push:
    branches:
      - feat/jh167-r5-real-android-contract-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current JH owner deps without production startup
        run: |
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund --package-lock=false
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: 'Regression - signed host, foldable, unified Android'
        run: node --test --test-concurrency=1 jh-server/owner-setup/android-direct/*.test.mjs
      - name: Verify no production runtime or browser removed
        run: |
          test -f jh-server/owner-setup/server-integration/server.mjs
          test -f jh-server/owner-setup/deployment/durable-native-job-policy.mjs
          test -f jh-server/browser-transport.mjs
          node --check jh-server/owner-setup/android-direct/unified-route.mjs
          if grep -E '(browserTool\(|@playwright/|browser_navigate|/mcp.*playwright)' jh-server/owner-setup/android-direct/unified-route.mjs; then
            echo "Unexpected server browser dependency" && exit 1
          fi

  compile-phone-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Confirm installed Android SDK platform (no deprecated tools package)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" "platforms;android-35"
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Compile JH foldable Kotlin candidate as library ONLY
        run: gradle -p android-fold-candidate :library:compileDebugKotlin --no-daemon
      - name: Confirm no APK or production signing generated
        run: |
          test ! -d android-fold-candidate/library/build/outputs/apk
          test -f android-fold-candidate/README.md

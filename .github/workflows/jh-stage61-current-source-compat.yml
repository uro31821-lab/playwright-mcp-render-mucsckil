name: JH Stage61 current server compatibility

on:
  push:
    branches: [fix/stage61-v10-snapshot-terminal-readback-20261103]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-server-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact current server dependencies
        run: |
          set -euo pipefail
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund --package-lock=false
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: Verify Stage61 server source and focused tests
        run: |
          set -euo pipefail
          node --check jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.test.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-host-adapter.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-host-adapter.test.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-router.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-router.test.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/snapshot-digest-readback.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/snapshot-digest-readback-patch.mjs
          node --test --test-concurrency=1 --test-reporter=spec \
            jh-server/owner-setup/jh168-mobile-unification/snapshot-digest-readback.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/snapshot-digest-readback-patch.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage25-live-operator-followup-entry.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage26-completion-delivery.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-host-adapter.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-router.test.mjs
      - name: Verify Stage61 against current reviewed JH runtime
        env:
          CI: 'true'
          NODE_ENV: test
          JH_OWNER_DEFER_LISTEN: '1'
          JH_MOBILE_WEB_13_MODE: EXPLICIT_SIGNED_ANDROID_RIGHT_13_V1
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-reporter=spec \
            jh-server/owner-setup/jh168-mobile-unification/stage61-current-source-compat.test.mjs
      - name: Preserve no-release boundaries
        run: |
          echo CURRENT_SERVER_HEAD="$(git rev-parse HEAD)"
          echo STAGE61_FINAL_OPERATOR_ORDER=PASS
          echo RENDER_DEPLOY=0
          echo APK_BUILD=0
          echo APK_INSTALL=0
          echo PHONE_E2E=NOT_RUN

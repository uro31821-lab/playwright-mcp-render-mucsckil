name: JH Stage77 on-demand location once
on:
  pull_request:
    branches: [jh-fix3-secure-server]
    paths:
      - 'jh-mobile-dual-engine/stage77/**'
      - '.github/workflows/jh-stage77-location-once.yml'
permissions: {contents: read}
jobs:
  location-once-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test --test-reporter=spec jh-mobile-dual-engine/stage77/stage77-location-once.test.mjs
      - run: |
          echo APK_BUILD=0
          echo APK_SIGN=0
          echo APK_INSTALL=0
          echo RENDER_DEPLOY=0
          echo PHONE_LOCATION_READ=0

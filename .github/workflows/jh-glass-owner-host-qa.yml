name: JH Glass Existing Owner Host Source QA
on:
  push:
    branches:
      - feature/jh-glass-photo-mailbox-20261110
    paths:
      - '.github/workflows/jh-glass-owner-host-qa.yml'
      - 'jh-server/owner-setup/owner-enrollment/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read-only checkout of development branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Strict source-only host preflight
        run: |
          set -euo pipefail
          node --version
          grep -q "createOwnerEnrollmentHttpHandler" jh-server/owner-setup/owner-enrollment/owner-host-bootstrap.mjs
          grep -q "owner-service-entry" jh-server/owner-setup/deployment/published-host-router.mjs
          grep -q 'JH_OWNER_ENABLED' jh-server/owner-setup/deployment/owner-service-entry.mjs
          node --check jh-server/owner-setup/owner-enrollment/owner-host-bootstrap.mjs
          node --check jh-server/owner-setup/owner-enrollment/owner-enrollment-http.mjs
          echo OWNER_HOST_SOURCE_PRECONDITIONS_FOUND
      - name: Install pinned owner-module QA dependencies without scripts
        run: |
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: Run existing authenticated owner trust and revocation tests
        run: |
          node --test --test-concurrency=1 jh-server/owner-setup/owner-enrollment/permanent-trust-revocation.test.mjs
          echo OWNER_HOST_SOURCE_TEST_PASS
      - name: No production/server/phone deployment
        run: |
          echo JH_GLASS_OWNER_HOST_QA_ONLY_NO_DEPLOY_NO_APP_INSTALL

name: JH Stage61 V10 current source full no-release verification

on:
  push:
    branches:
      - fix/stage61-v10-native-select-open-durable-20261104

permissions:
  contents: read

jobs:
  current-mobile-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_ENV: test
      JH_OWNER_DEFER_LISTEN: '1'
      JH_MOBILE_WEB_13_MODE: EXPLICIT_SIGNED_ANDROID_RIGHT_13_V1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reviewed dependencies
        run: |
          set -euo pipefail
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund --package-lock=false
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: Candidate provenance and exact diff gate
        run: |
          set -euo pipefail
          BASE=origin/fix/stage61-v10-mobile13-web-contract-20261103
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE"...HEAD | sort > /tmp/changed.txt
          cat >/tmp/allowed.txt <<'EOF'
          .github/workflows/jh-stage61-v10-current-source-full-no-release.yml
          jh-server/owner-setup/jh168-mobile-unification/mobile13-action-policy.mjs
          jh-server/owner-setup/jh168-mobile-unification/mobile13-action-policy.test.mjs
          jh-server/owner-setup/jh168-mobile-unification/mobile13-integrated-contract.test.mjs
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
      - name: Current mobile web and Stage61 source suites
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-reporter=spec \
            jh-server/owner-setup/jh168-mobile-unification/mobile-web-tool-patch.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/mobile-web-13-runtime-contract.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/mobile-web-4-entrypoint-contract.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/mobile13-action-policy.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/mobile13-integrated-contract.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/mobile13-wait-condition.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-host-adapter.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-router.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-current-source-compat.test.mjs \
            jh-server/verification/jh167-exact-right-click-durable.test.mjs \
            jh-server/verification/durable-computer-policy.test.mjs
      - name: Residual Playwright audit
        run: |
          set -euo pipefail
          node jh-server/owner-setup/jh168-mobile-unification/mobile-web-residual-playwright-audit.mjs
      - name: No release boundary
        if: always()
        run: |
          echo RENDER_DEPLOY=0
          echo APK_BUILD=0
          echo APK_INSTALL=0
          echo PHONE_ACTION_REPLAY=0

name: JH Kabiseo pinned model metadata contract (data only)
on:
  push:
    branches: [kabiseo-native-camera-v023-20261107]
    paths:
      - 'tools/kabiseo-model-contract/**'
      - '.github/workflows/jh-kabiseo-model-contract.yml'
permissions: {contents: read}
jobs:
  inspect-metadata-only:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false}
      - name: Existing private JH and frozen camera source unchanged
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 1cfececb17a04a54aba653a4117a2ec3afd5a481
          if($LASTEXITCODE){exit $LASTEXITCODE}
          git diff --exit-code 1cfececb17a04a54aba653a4117a2ec3afd5a481 HEAD -- jh-server host-kabiseo-assist tools/kabiseo-model-provenance tools/kabiseo-compatible-inputs tools/kabiseo-abi-review tools/kabiseo-dependency-review
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Inspect exact licensed model structure without loading TFLite
        shell: pwsh
        run: |
          python tools/kabiseo-model-contract/inspect_contract.py
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kabiseo-model-contract-v027-report-only
          path: kabiseo-model-contract/report.json
          retention-days: 14
          if-no-files-found: error

name: JH Kabiseo public host compile inputs
on:
  pull_request:
    paths:
      - 'host-kabiseo-assist/tools/compile-kit/**'
      - '.github/workflows/jh-kabiseo-host-compile-kit.yml'
permissions:
  contents: read
jobs:
  export-public-compile-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with: {distribution: temurin, java-version: '17'}
      - name: Install checksum-pinned Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 https://downloads.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          printf '%s  %s\n' d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab "$RUNNER_TEMP/gradle.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Resolve the supplied host dependency versions
        working-directory: host-kabiseo-assist/tools/compile-kit
        run: gradle --no-daemon --console=plain exportCompileDependencies
      - name: Export public API jars and compiler (no app, secrets or install)
        run: python3 host-kabiseo-assist/tools/compile-kit/export_kit.py
      - name: Preserve bounded compiler kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kabiseo-host-compile-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/kabiseo-compile-kit/
          retention-days: 3
          if-no-files-found: error

name: JH Kabiseo offline full-build dependencies
on:
  pull_request:
    paths:
      - 'host-kabiseo-assist/tools/offline-kit/**'
      - '.github/workflows/jh-kabiseo-offline-kit.yml'
permissions: {contents: read}
concurrency:
  group: kabiseo-offline-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  public-build-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/kabiseo-public-gradle-home
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with: {distribution: temurin, java-version: '17'}
      - name: Verify and install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 https://downloads.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          printf '%s  %s\n' d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab "$RUNNER_TEMP/gradle.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Create public-only dependency seed
        run: python3 host-kabiseo-assist/tools/offline-kit/prepare.py seed
      - name: Warm real packaging, tests and lint dependencies (NOT JH app)
        working-directory: ${{ runner.temp }}/kabiseo-public-seed
        run: gradle --no-daemon --max-workers=2 --console=plain :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
      - name: Export bounded public SDK and dependency cache without credentials
        run: python3 host-kabiseo-assist/tools/offline-kit/prepare.py export
      - name: Retain short-lived offline kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kabiseo-offline-kit-${{ github.run_id }}
          path: ${{ runner.temp }}/kabiseo-offline-kit/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

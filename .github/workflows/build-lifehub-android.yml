name: Build Life Hub Android Bridge
on:
  push:
    branches: [lifehub-android-v6]
    paths:
      - 'lifehub-android/**'
      - '.github/workflows/build-lifehub-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifehub-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: korean-life-hub-bridge-6.0-debug
          path: lifehub-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: JH Plugin structure dedup package
on:
  pull_request:
    branches: [main]
jobs:
  pack:
    if: github.head_ref == 'jh-plugin-structure-dedup-20261108a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify root-to-hub dedup overlay
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tmp/jh_plugin_struct_dedup_current.zip.b64 > jh-plugin-overlay.zip
          unzip -t jh-plugin-overlay.zip
          python - <<'PY'
          import json, zipfile
          z=zipfile.ZipFile('jh-plugin-overlay.zip')
          names=set(z.namelist())
          assert {'plugin.json','.codex-plugin/plugin.json','skills/jh-secure-live/SKILL.md'} <= names
          versions=[json.loads(z.read(p).decode())['version'] for p in ['plugin.json','.codex-plugin/plugin.json']]
          assert versions[0]==versions[1] and versions[0].startswith('1.34.'), versions
          s=z.read('skills/jh-secure-live/SKILL.md').decode()
          assert s.count('## 비서 라우팅 공통 기준 — assistant-hub 단일 기준')==1
          removed=[
            '## 모든 답변의 자료·영상 링크 — 2026-11-08 사용자 확정',
            '## 아이디어비서 — 사진과 조건으로 생활문제 해결',
            '## 날씨비서 — 모든 현재 선택에서 필요한 날씨만 연결',
            '## 대안비서 — 돌발변수의 공통 보조',
            '## 청구서 비서 — 유지 판단을 첫 줄에',
            '## 딴비서 — 의견받기 선택 후 분석']
          for h in removed: assert h not in s, h
          assert '# JH Secure Live — JH167' in s
          assert '## MCP route selection and authentication diagnosis' in s
          print('ROOT_TO_HUB_DEDUP_PASS', versions[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jh-plugin-struct-dedup-overlay
          path: jh-plugin-overlay.zip
          if-no-files-found: error
          retention-days: 1

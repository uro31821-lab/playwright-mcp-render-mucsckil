name: JH Plugin structure dedup package
on:
  pull_request:
    branches: [main]
jobs:
  pack:
    if: github.head_ref == 'jh-plugin-structure-dedup-20261108a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify plugin overlay
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tmp/jh_plugin_struct_dedup_current.zip.b64 > jh-plugin-overlay.zip
          unzip -t jh-plugin-overlay.zip
          python - <<'PY'
          import json, zipfile
          z=zipfile.ZipFile('jh-plugin-overlay.zip')
          names=set(z.namelist())
          required={'plugin.json','.codex-plugin/plugin.json'}
          assert required <= names
          v=[]
          for p in required:
              j=json.loads(z.read(p).decode())
              v.append(j['version'])
          assert v==['1.34.58','1.34.58'] or v==['1.34.58','1.34.58'][::-1]
          attr=[
            'skills/jh-chaekbiseo/SKILL.md','skills/jh-ebiseo-assist/SKILL.md',
            'skills/jh-gitbiseo-blocker-executor/SKILL.md','skills/jh-open-source-scout/SKILL.md',
            'skills/jh-pyeonbiseo/SKILL.md','skills/jh-yeobiseo/SKILL.md']
          weather=[
            'skills/jh-meokbiseo/SKILL.md','skills/jh-shoppingbiseo/SKILL.md',
            'skills/jh-yeobiseo/SKILL.md','skills/jh-yeyakbiseo/SKILL.md']
          handoff=['skills/jh-dev-toolkit/SKILL.md','skills/jh-ebiseo-assist/SKILL.md']
          old_attr='이 비서가 설명·추천·의견·검토·분석·개발·실행·진행·완료에 관여하면 해당 구간 맨 앞을'
          new_attr='공통 참여 표시는 [assistant-attribution.md]'
          old_weather="현재 주 담당·목표·조건·번호 메뉴를 유지하고, 허브의 `intent.weatherRelevance:'relevant'`로 연결한다."
          new_weather='상세 판단은 [날씨비서](../jh-nalssibiseo/SKILL.md) 한 곳을 따른다.'
          old_handoff='현재 전문 규칙과 전용 기록은 유지하고, 답과 사용자 선택 메뉴는 주 담당이 하나로 모은다.'
          new_handoff='공통 작업 인계·재개는 [assistant-hub]'
          for p in attr:
              s=z.read(p).decode()
              assert old_attr not in s and new_attr in s, p
          for p in weather:
              s=z.read(p).decode()
              assert old_weather not in s and new_weather in s, p
          for p in handoff:
              s=z.read(p).decode()
              assert old_handoff not in s and new_handoff in s, p
          print('COMMON_RULE_DEDUP_PASS', len(names), 'files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jh-plugin-struct-dedup-overlay
          path: jh-plugin-overlay.zip
          if-no-files-found: error
          retention-days: 1

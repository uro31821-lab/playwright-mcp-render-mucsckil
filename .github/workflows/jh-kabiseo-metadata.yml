name: JH Kabiseo metadata contract
on:
  pull_request:
    paths:
      - 'host-kabiseo-assist/**'
      - '.github/workflows/jh-kabiseo-metadata.yml'
  push:
    branches: ['kabiseo-camera-metadata-v05-20261105']
    paths:
      - 'host-kabiseo-assist/**'
      - '.github/workflows/jh-kabiseo-metadata.yml'
permissions:
  contents: read
jobs:
  metadata-jvm-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run read-only metadata contract scenarios
        run: python3 host-kabiseo-assist/tools/test_metadata.py

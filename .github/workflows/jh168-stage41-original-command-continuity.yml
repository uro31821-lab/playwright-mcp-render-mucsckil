name: JH168 Stage41 original signed command continuity and discard provenance (NO RELEASE)
on:
  pull_request:
    branches: [jh-fix3-secure-server]
    paths:
      - 'jh-server/owner-setup/jh168-mobile-unification/stage41-*'
      - 'jh-server/owner-setup/jh168-mobile-unification/stage25-live-operator-followup-entry.mjs'
      - '.github/workflows/jh168-stage41-original-command-continuity.yml'
permissions:
  contents: read
jobs:
  exact-source-command-and-owner-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CI: 'true'
      NODE_ENV: test
      JH_OWNER_DEFER_LISTEN: '1'
      JH_MOBILE_WEB_13_MODE: EXPLICIT_SIGNED_ANDROID_RIGHT_13_V1
      JH_STAGE26_SIGNED_COMPLETION_ACK: EXPLICIT_IDENTICAL_SIGNED_RESULT_V1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - name: Protect original global command authority and signed phone-local security
        run: |
          git diff --exit-code origin/jh-fix3-secure-server HEAD -- \
            jh-server/server.mjs \
            jh-server/owner-setup/deployment/durable-mcp-workflow-patch.mjs \
            jh-server/owner-setup/deployment/jh155-all-modules-patch.mjs \
            jh-server/owner-setup/deployment/jh155-split-integration-patch.mjs \
            jh-server/owner-setup/deployment/jh-recovery-write-fence.mjs \
            jh-server/owner-setup/deployment/durable-native-job-policy.mjs \
            jh-server/owner-setup/deployment/durable-manual-circuit-fence.mjs \
            jh-server/owner-setup/payment/payment-runtime-patch.mjs \
            jh-server/owner-setup/deployment/jh-result-verification \
            jh-server/owner-setup/server-integration \
            jh-server/owner-setup/android-direct
          echo ORIGINAL_COMMAND_DISCARD_HMAC_PAYMENT_AND_OWNER_FENCES_UNCHANGED=YES
      - name: Install original locked owner/server test dependencies
        run: |
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund --package-lock=false
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: NEW Stage41 exact lifecycle provenance and negative signed-discard tests
        run: |
          node --test --test-concurrency=1 --test-reporter=spec jh-server/owner-setup/jh168-mobile-unification/stage41-command-lifecycle.test.mjs
      - name: Existing Stage40 owner admission and Stage39 cross engine integration
        run: |
          node --test --test-concurrency=1 --test-reporter=spec jh-server/owner-setup/jh168-mobile-unification/stage40-owner-admission-diagnostics.test.mjs
          node --test --test-concurrency=1 --test-reporter=spec jh-server/owner-setup/jh168-mobile-unification/stage39-pending-independent.test.mjs
          node --test --test-concurrency=1 --test-reporter=spec jh-server/owner-setup/jh168-mobile-unification/mobile13-integrated-contract.test.mjs
          node --test --test-concurrency=1 --test-reporter=spec jh-server/owner-setup/jh168-mobile-unification/mobile-web-stage25-operator.test.mjs
      - name: Existing original Secure56 signing and historical command/discard regressions
        run: |
          node --test --test-concurrency=1 --test-reporter=spec jh-server/owner-setup/deployment/jh167-g6-real-durable-host.test.mjs
          node --test --test-concurrency=1 --test-reporter=spec jh-server/verification/durable-computer-policy.test.mjs
          node --test --test-concurrency=1 --test-reporter=spec jh-server/owner-setup/jh168-mobile-unification/stage38-generated-operator.test.mjs
          node --test --test-concurrency=1 --test-reporter=spec jh-server/owner-setup/jh168-mobile-unification/stage26-completion-delivery.test.mjs
      - name: No first-hand phone action and no owners mutated
        run: |
          test -z "${RENDER_SERVICE_ID:-}"
          echo STAGE41_SOURCE_ONLY=YES
          echo ORIGINAL_SITE_DISCARD_SIGNATURE=UNCHANGED
          echo ORIGINAL_COMMAND_FENCE=UNCHANGED
          echo HISTORICAL_29_UNKNOWN=UNCHANGED
          echo OWNER_SQLITE_MIGRATION=0
          echo RENDER_DEPLOY=0
          echo DEVICE_EFFECT_REPLAY=0
          echo APK_INSTALL=0
          echo NEW_CODE_REAL_PHONE_CROSS_ENGINE_E2E=NOT_RUN

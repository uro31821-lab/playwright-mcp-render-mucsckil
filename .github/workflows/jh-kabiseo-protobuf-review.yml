name: JH Kabiseo replacement protobuf quarantine review
on:
  push:
    branches: [kabiseo-native-camera-v023-20261107]
    paths: ['tools/kabiseo-dependency-review/review_protobuf.py', '.github/workflows/jh-kabiseo-protobuf-review.yml']
permissions: {contents: read}
jobs:
  inspect-only:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false}
      - name: Inspect replacement JAR without executing it
        shell: pwsh
        run: |
          python tools/kabiseo-dependency-review/review_protobuf.py
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Existing Defender scan without changing security settings
        shell: pwsh
        run: |
          $root=Join-Path $env:GITHUB_WORKSPACE 'kabiseo-protobuf-review'
          $r=[ordered]@{schema='KABISEO_PROTOBUF_AV_V025';status='NOT_AVAILABLE';runId=$env:GITHUB_RUN_ID;head=$env:GITHUB_SHA;settingsChanged=$false;scanExitCode=$null;releaseApproved=$false}
          try {
            $s=Get-MpComputerStatus -ErrorAction Stop
            $r.antivirusEnabled=$s.AntivirusEnabled
            $r.realTimeProtectionEnabled=$s.RealTimeProtectionEnabled
            $r.signatureVersion=$s.AntivirusSignatureVersion
            $r.signatureUpdated=$s.AntivirusSignatureLastUpdated.ToUniversalTime().ToString('o')
            $exe=Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" -ErrorAction SilentlyContinue|Sort-Object FullName -Descending|Select-Object -First 1
            if($s.AntivirusEnabled -and $exe){
              & $exe.FullName -Scan -ScanType 3 -File $root -DisableRemediation *> (Join-Path $root 'defender.log')
              $r.scanExitCode=$LASTEXITCODE
              $r.status=if($LASTEXITCODE -eq 0){'SCAN_COMPLETED_NO_THREAT_REPORTED'}else{'SCAN_FAILED_OR_THREAT_REPORTED'}
            }
          }catch{$r.errorType=$_.Exception.GetType().FullName}
          $r|ConvertTo-Json|Set-Content (Join-Path $root 'antivirus.json') -Encoding utf8
          if($r.status -ne 'SCAN_COMPLETED_NO_THREAT_REPORTED'){Remove-Item (Join-Path $root '*.jar') -Force -ErrorAction SilentlyContinue}
          Write-Host ('PROTOBUF_AV='+($r|ConvertTo-Json -Compress))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kabiseo-protobuf-replacement-v025
          path: kabiseo-protobuf-review/*
          if-no-files-found: error
          retention-days: 14

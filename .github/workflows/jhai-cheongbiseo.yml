name: JHAI Cheongbiseo cleanup

on:
  pull_request:
    branches:
      - jh-fix3-secure-server
      - main
    paths:
      - "jh-server/cheongbiseo-policy.mjs"
      - "jh-server/cheongbiseo-policy.test.mjs"
      - "jh-server/server.mjs"
      - "host-cheongbiseo-cleanup/**"
      - "host-ebiseo-assist/plugin-overlay/plugin.json"
      - "host-ebiseo-assist/plugin-overlay/skills/jh-cheongbiseo/**"
      - ".github/workflows/jhai-cheongbiseo.yml"
  push:
    branches:
      - "feat/cheongbiseo-*"
    paths:
      - "jh-server/cheongbiseo-policy.mjs"
      - "jh-server/cheongbiseo-policy.test.mjs"
      - "jh-server/server.mjs"
      - "host-cheongbiseo-cleanup/**"
      - "host-ebiseo-assist/plugin-overlay/plugin.json"
      - "host-ebiseo-assist/plugin-overlay/skills/jh-cheongbiseo/**"
      - ".github/workflows/jhai-cheongbiseo.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Retention policy tests
        run: node --test jh-server/cheongbiseo-policy.test.mjs
      - name: JH server syntax
        run: node --check jh-server/server.mjs
      - name: Plugin metadata JSON
        run: node -e "JSON.parse(require('fs').readFileSync('host-ebiseo-assist/plugin-overlay/plugin.json','utf8')); console.log('plugin.json ok')"

name: JH168 Stage63 Final Clean Audit

on:
  push:
    branches:
      - fix/stage63-native-select-owner-admission-20261104
    paths:
      - .github/workflows/jh168-stage63-final-clean-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/stage63-native-select-owner-admission-20261104

      - name: Verify cleaned candidate history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            jh-fix3-secure-server:refs/remotes/origin/jh-fix3-secure-server
          test "$(git rev-parse refs/remotes/origin/jh-fix3-secure-server)" = \
            bdd5feb862102857f70133e1da87679fcd393b8d
          git merge-base --is-ancestor \
            bdd5feb862102857f70133e1da87679fcd393b8d HEAD
          git merge-base --is-ancestor \
            96c307c2057d5cee1560684b3f52ce41d3a76378 HEAD
          test ! -e .stage63-payload
          test ! -e .github/workflows/jh168-stage63-payload-inspect.yml
          test ! -e .github/workflows/jh168-stage63-payload-validate.yml
          test -z "$(git diff --name-only 96c307c2057d5cee1560684b3f52ce41d3a76378 HEAD -- \
            jh-server/owner-setup/jh168-mobile-unification/stage25-live-operator-followup-entry.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-current-source-compat.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix jh-server/owner-setup
          npm ci --ignore-scripts --prefix jh-server/owner-setup/owner-enrollment

      - name: Source and functional regression
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            jh-server/owner-setup/jh168-mobile-unification/reviewed-source-audit.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage42-protected-source-provenance.test.mjs \
            2>&1 | tee /tmp/stage63-final-source.log
          node --test --test-concurrency=1 \
            jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage25-live-operator-followup-entry.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage40-owner-admission-diagnostics.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage41-command-lifecycle.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage44-device-focus.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-current-source-compat.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-host-adapter.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-router.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/mobile-web-tool-patch.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/mobile13-command-diagnostics.test.mjs \
            2>&1 | tee /tmp/stage63-final-functional.log

      - name: Verify only exact test-generated residue
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/stage63-expected.txt <<'EOF'
          jh-server/owner-setup/browser-live/browser-session-functional.mjs
          jh-server/owner-setup/deployment/durable-live-news-review-generated.mjs
          jh-server/owner-setup/deployment/operational-service-durable-live.mjs
          jh-server/owner-setup/deployment/operational-service-durable-return-route56.mjs
          jh-server/owner-setup/deployment/operational-service-pending-approval-operator.mjs
          jh-server/owner-setup/deployment/operational-service-stage25-followup-operator.mjs
          jh-server/owner-setup/deployment/owner-service-cutover-candidate.mjs
          jh-server/owner-setup/deployment/owner-service-durable-candidate.mjs
          jh-server/owner-setup/deployment/owner-service-durable-return-route56.mjs
          jh-server/owner-setup/deployment/owner-service-pending-approval-operator.mjs
          jh-server/owner-setup/deployment/owner-service-stage25-followup-operator.mjs
          jh-server/owner-setup/deployment/unified-service-durable-live.mjs
          jh-server/owner-setup/deployment/unified-service-durable-return-route56.mjs
          jh-server/owner-setup/deployment/unified-service-pending-approval-operator.mjs
          jh-server/owner-setup/deployment/unified-service-stage25-followup-operator.mjs
          jh-server/owner-setup/server-integration/jh168-followup-operator-attestation.json
          jh-server/owner-setup/server-integration/pending-approval-operator-attestation.json
          jh-server/owner-setup/server-integration/server-durable-native-candidate.mjs
          jh-server/owner-setup/server-integration/server-durable-native-return-route56.mjs
          jh-server/owner-setup/server-integration/server-functional.mjs
          jh-server/owner-setup/server-integration/server-jh168-pending-approval-followup-operator.mjs
          jh-server/owner-setup/server-integration/server-jh168-pending-approval-operator.mjs
          EOF
          sed -i 's/^          //' /tmp/stage63-expected.txt
          git status --porcelain=v1 | tee /tmp/stage63-final-status.log
          if grep -Ev '^\?\? ' /tmp/stage63-final-status.log > /tmp/stage63-final-unexpected.log; then
            cat /tmp/stage63-final-unexpected.log
            exit 1
          fi
          sed -n 's/^?? //p' /tmp/stage63-final-status.log | sort > /tmp/stage63-actual.txt
          sort /tmp/stage63-expected.txt > /tmp/stage63-expected.sorted
          diff -u /tmp/stage63-expected.sorted /tmp/stage63-actual.txt
          while IFS= read -r file; do
            test -f "$file"
            test ! -L "$file"
            rm -f -- "$file"
          done < /tmp/stage63-expected.txt
          test -z "$(git status --porcelain=v1)"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jh168-stage63-final-clean-audit
          path: |
            /tmp/stage63-final-source.log
            /tmp/stage63-final-functional.log
            /tmp/stage63-final-status.log
            /tmp/stage63-actual.txt
            /tmp/stage63-expected.sorted
            /tmp/stage63-final-unexpected.log
          if-no-files-found: warn
          retention-days: 7

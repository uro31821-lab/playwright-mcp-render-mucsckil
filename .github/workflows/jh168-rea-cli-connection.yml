name: JH REA reusable static analysis
on:
  push:
    branches: ['devtools/jh-rea-runner']
    paths:
      - '.github/workflows/jh168-rea-cli-connection.yml'
      - 'tools/rea/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jh-rea-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rea-static-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Create isolated evidence directory
        id: evidence
        shell: bash
        run: |
          directory=$(mktemp -d "${RUNNER_TEMP:?}/jh-rea.XXXXXX")
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Validate request and stage committed source without executing it
        env:
          REPORT_DIR: ${{ steps.evidence.outputs.directory }}
        run: |
          test "$(node --version)" = 'v24.22.1'
          command -v ps
          python3 -B tools/rea/bridge.py prepare tools/rea/request.json "$REPORT_DIR"
      - name: Install official pinned REA using existing verified method
        env:
          REPORT_DIR: ${{ steps.evidence.outputs.directory }}
        run: |
          npm install --prefix "${RUNNER_TEMP}/jh168-rea-tool" --no-audit --no-fund --ignore-scripts --save-exact rea-agents@6.8.0
          node -e "const p=require(process.argv[1]);if(p.version!=='6.8.0')process.exit(2)" "${RUNNER_TEMP}/jh168-rea-tool/node_modules/rea-agents/package.json"
          echo "${RUNNER_TEMP}/jh168-rea-tool/node_modules/.bin" >> "$GITHUB_PATH"
          sha256sum "${RUNNER_TEMP}/jh168-rea-tool/package-lock.json" > "$REPORT_DIR/dependency-lock.sha256"
      - name: Run official static analysis and preserve original exit code
        env:
          REPORT_DIR: ${{ steps.evidence.outputs.directory }}
        run: |
          node --version > "$REPORT_DIR/node-version.txt"
          rea --version > "$REPORT_DIR/rea-version.txt"
          rea --help > /dev/null
          set +e
          rea analyze-javascript-application "$REPORT_DIR/target" --json --full-output > "$REPORT_DIR/analysis.json" 2> "$REPORT_DIR/analysis.stderr"
          status=$?
          set -e
          echo "$status" > "$REPORT_DIR/exit-code.txt"
          echo "JH_REA_ANALYSIS_EXIT=$status"
          exit "$status"
      - name: Validate exact input and machine-readable result
        env:
          REPORT_DIR: ${{ steps.evidence.outputs.directory }}
        run: python3 -B tools/rea/bridge.py validate "$REPORT_DIR"
      - name: Preserve bounded result for reuse
        if: ${{ always() && steps.evidence.outputs.directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jh-rea-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.evidence.outputs.directory }}/*.json
            ${{ steps.evidence.outputs.directory }}/*.txt
            ${{ steps.evidence.outputs.directory }}/*.sha256
            ${{ steps.evidence.outputs.directory }}/analysis.stderr
          if-no-files-found: warn
          retention-days: 30

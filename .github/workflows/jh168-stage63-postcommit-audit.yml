name: JH168 Stage63 Postcommit Audit

on:
  push:
    branches:
      - fix/stage63-native-select-owner-admission-20261104
    paths:
      - .github/workflows/jh168-stage63-postcommit-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/stage63-native-select-owner-admission-20261104

      - name: Fetch fixed live-base ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            jh-fix3-secure-server:refs/remotes/origin/jh-fix3-secure-server
          test "$(git rev-parse refs/remotes/origin/jh-fix3-secure-server)" = \
            bdd5feb862102857f70133e1da87679fcd393b8d
          git merge-base --is-ancestor \
            bdd5feb862102857f70133e1da87679fcd393b8d HEAD

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install existing locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix jh-server/owner-setup
          npm ci --ignore-scripts --prefix jh-server/owner-setup/owner-enrollment

      - name: Verify exact reviewed Git objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 96c307c2057d5cee1560684b3f52ce41d3a76378^{commit})" = \
            96c307c2057d5cee1560684b3f52ce41d3a76378
          git merge-base --is-ancestor \
            96c307c2057d5cee1560684b3f52ce41d3a76378 HEAD
          test "$(git ls-tree 96c307c2057d5cee1560684b3f52ce41d3a76378 -- jh-server/owner-setup/jh168-mobile-unification/stage25-live-operator-followup-entry.mjs)" = \
            $'100644 blob b381e0325c1ec300f80828b798ad8310d0bf69de\tjh-server/owner-setup/jh168-mobile-unification/stage25-live-operator-followup-entry.mjs'
          test "$(git ls-tree 96c307c2057d5cee1560684b3f52ce41d3a76378 -- jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs)" = \
            $'100644 blob 6c3fc142e60624c5af6f7b46aef32a4dbbd17fe1\tjh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs'
          test "$(git ls-tree 96c307c2057d5cee1560684b3f52ce41d3a76378 -- jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs)" = \
            $'100644 blob 473c07d027e45ae1e9f5b472e4cd4040488b1d9e\tjh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs'
          test -z "$(git diff --name-only 96c307c2057d5cee1560684b3f52ce41d3a76378 HEAD -- \
            jh-server/owner-setup/jh168-mobile-unification/stage25-live-operator-followup-entry.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs)"

      - name: Syntax and source audit
        shell: bash
        run: |
          set -euo pipefail
          node --check jh-server/owner-setup/jh168-mobile-unification/reviewed-source-audit.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/stage25-live-operator-followup-entry.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs
          node --test --test-concurrency=1 \
            jh-server/owner-setup/jh168-mobile-unification/reviewed-source-audit.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage42-protected-source-provenance.test.mjs \
            2>&1 | tee /tmp/stage63-source-audit.log

      - name: Full Stage63 functional regression
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage25-live-operator-followup-entry.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage40-owner-admission-diagnostics.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage41-command-lifecycle.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage44-device-focus.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-current-source-compat.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-host-adapter.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-router.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/mobile-web-tool-patch.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/mobile13-command-diagnostics.test.mjs \
            2>&1 | tee /tmp/stage63-functional.log

      - name: Confirm clean read-only worktree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jh168-stage63-postcommit-audit
          path: |
            /tmp/stage63-source-audit.log
            /tmp/stage63-functional.log
          if-no-files-found: warn
          retention-days: 7

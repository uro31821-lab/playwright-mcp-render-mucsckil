name: JH stage3 existing-handler verified roundtrip
on:
  push:
    branches: ['jh-handoff-runtime-stage3-20261010']
    paths:
      - 'jh-server/owner-setup/deployment/verified-native-roundtrip.mjs'
      - 'jh-server/owner-setup/deployment/verified-roundtrip-runtime.mjs'
      - 'jh-server/verification/verified-native-roundtrip.test.mjs'
      - 'jh-server/verification/verified-roundtrip-runtime-http.mjs'
      - '.github/workflows/jh-handoff-runtime-stage3.yml'
permissions:
  contents: read
jobs:
  integrated-handler:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: New executor and adverse-boundary unit tests
        working-directory: jh-server
        run: |
          node --check owner-setup/deployment/verified-native-roundtrip.mjs
          node --check owner-setup/deployment/verified-roundtrip-runtime.mjs
          node --test verification/verified-native-roundtrip.test.mjs
      - name: Retain previous 15 helper tests without relabelling as new
        working-directory: jh-server
        run: node --test verification/verified-return-handoff.test.mjs
      - name: Existing authentication dependencies and signed regressions
        working-directory: jh-server
        run: npm install --no-audit --no-fund
      - name: One existing MCP call drives the entire candidate roundtrip
        working-directory: jh-server
        run: |
          node --check verification/verified-roundtrip-runtime-http.mjs
          timeout 160s node verification/verified-roundtrip-runtime-http.mjs
      - name: Existing dispatch, authentication, production startup and helper remain identical
        run: |
          git diff --exit-code 644544d64410083598fb968785cddd049b21bfd7 -- jh-server/server.mjs jh-server/package.json jh-server/owner-setup/server-integration jh-server/owner-setup/trusted-server jh-server/owner-setup/owner-enrollment jh-server/owner-setup/deployment/published-host-router.mjs jh-server/owner-setup/deployment/durable-live-release.mjs jh-server/owner-setup/deployment/verified-return-handoff.mjs
          echo JH_STAGE3_NO_PRODUCTION_DEPLOY_NO_PHONE_NO_APK_CHANGE

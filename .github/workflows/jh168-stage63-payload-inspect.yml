name: JH168 Stage63 Payload Inspect

on:
  push:
    branches:
      - fix/stage63-native-select-owner-admission-20261104
    paths:
      - .github/workflows/jh168-stage63-payload-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decode and inspect payload without executing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage63-inspection/extracted

          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "parts:"
            wc -c .stage63-payload/part-* 
            echo "part_sha256:"
            sha256sum .stage63-payload/part-*
          } > stage63-inspection/summary.txt

          cat .stage63-payload/part-* | tr -d '\r\n' > /tmp/stage63.payload.b64
          base64 --decode /tmp/stage63.payload.b64 > /tmp/stage63.payload.gz
          gzip -t /tmp/stage63.payload.gz
          gzip -dc /tmp/stage63.payload.gz > /tmp/stage63.payload.decoded

          {
            echo "base64_chars=$(wc -c < /tmp/stage63.payload.b64)"
            echo "gzip_bytes=$(wc -c < /tmp/stage63.payload.gz)"
            echo "decoded_bytes=$(wc -c < /tmp/stage63.payload.decoded)"
            echo "gzip_sha256=$(sha256sum /tmp/stage63.payload.gz | awk '{print $1}')"
            echo "decoded_sha256=$(sha256sum /tmp/stage63.payload.decoded | awk '{print $1}')"
            echo -n "decoded_file_type="
            file -b /tmp/stage63.payload.decoded
          } >> stage63-inspection/summary.txt

          python - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import tarfile

          source = pathlib.Path('/tmp/stage63.payload.decoded')
          out = pathlib.Path('stage63-inspection')
          extracted = out / 'extracted'

          result = {
              'archive': False,
              'safe': False,
              'members': [],
              'unsafe_members': [],
          }

          try:
              with tarfile.open(source, 'r:*') as tf:
                  result['archive'] = True
                  members = tf.getmembers()
                  for member in members:
                      pure = pathlib.PurePosixPath(member.name)
                      unsafe = (
                          pure.is_absolute()
                          or '..' in pure.parts
                          or member.issym()
                          or member.islnk()
                          or member.isdev()
                      )
                      item = {
                          'name': member.name,
                          'size': member.size,
                          'type': member.type.decode('latin-1') if isinstance(member.type, bytes) else str(member.type),
                          'mode': oct(member.mode),
                          'unsafe': unsafe,
                      }
                      result['members'].append(item)
                      if unsafe:
                          result['unsafe_members'].append(member.name)

                  if not result['unsafe_members']:
                      result['safe'] = True
                      tf.extractall(extracted)
          except tarfile.TarError:
              shutil.copy2(source, out / 'decoded-payload.bin')

          (out / 'manifest.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          if result['unsafe_members']:
              raise SystemExit('Unsafe archive members detected; extraction refused')
          PY

          find stage63-inspection -maxdepth 6 -type f -printf '%P\t%s bytes\n' | sort > stage63-inspection/files.txt

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: jh168-stage63-payload-inspection
          path: stage63-inspection
          if-no-files-found: error
          retention-days: 7

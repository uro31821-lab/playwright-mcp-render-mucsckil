name: JH ambiguous dispatched timeout no-replay
on:
  push:
    branches: ['jh-ambiguous-timeout-fence-20261010']
    paths:
      - 'jh-server/owner-setup/deployment/native-readback.mjs'
      - 'jh-server/verification/uncertain-timeout-e2e.mjs'
      - '.github/workflows/jh-uncertain-timeout.yml'
permissions:
  contents: read
jobs:
  no-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Install dependencies and preserve authenticated checks
        working-directory: jh-server
        run: npm install --no-audit --no-fund
      - name: Syntax
        working-directory: jh-server
        run: |
          node --check owner-setup/deployment/native-readback.mjs
          node --check verification/uncertain-timeout-e2e.mjs
      - name: Real HTTP MCP, accelerated synthetic job TTL only
        working-directory: jh-server
        run: timeout 130s node verification/uncertain-timeout-e2e.mjs
      - name: Preserve trusted receipts, session proof and renewal regressions
        working-directory: jh-server
        run: node --test owner-setup/trusted-server/dispatch-receipts*.test.mjs owner-setup/trusted-server/trusted-renewal.test.mjs
      - name: Protected runtime and setup unchanged
        run: |
          git diff --exit-code 78c0bac854c45235dd728294eba630436c35bd72 -- jh-server/server.mjs jh-server/auth-diagnostics-entry.mjs jh-server/owner-setup/server-integration jh-server/owner-setup/browser-live jh-server/owner-setup/trusted-server jh-server/owner-setup/deployment/functional-release-runtime.mjs jh-server/owner-setup/deployment/owner-service-entry.mjs jh-server/owner-setup/deployment/operational-service-entry.mjs
      - run: echo JH_UNCERTAIN_TIMEOUT_FENCE_VERIFIED

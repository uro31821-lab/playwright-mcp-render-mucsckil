name: JH168 Stage63 Payload Validate

on:
  push:
    branches:
      - fix/stage63-native-select-owner-admission-20261104
    paths:
      - .github/workflows/jh168-stage63-payload-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch with reviewed history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch protected comparison branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            jh-fix3-secure-server:refs/remotes/origin/jh-fix3-secure-server

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install existing locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix jh-server/owner-setup
          npm ci --ignore-scripts --prefix jh-server/owner-setup/owner-enrollment

      - name: Safely apply Stage63 payload in ephemeral workspace
        shell: bash
        run: |
          set -euo pipefail
          cat .stage63-payload/part-* | tr -d '\r\n' | base64 --decode > /tmp/stage63.payload.gz
          gzip -t /tmp/stage63.payload.gz
          gzip -dc /tmp/stage63.payload.gz > /tmp/stage63.payload.tar
          python - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/stage63.payload.tar')
          out = pathlib.Path('/tmp/stage63-extracted')
          out.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'r:') as tf:
              members = tf.getmembers()
              for member in members:
                  p = pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts or member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsafe member: {member.name}')
              tf.extractall(out)
          PY
          cp -a /tmp/stage63-extracted/jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs
          cp -a /tmp/stage63-extracted/jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs

      - name: Apply exact Stage63 test and Stage25 compatibility corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs')
          source = test_path.read_text(encoding='utf-8')
          before = (
              " const helper=helperFromPatched(patched);\n"
              " assert.ok(helper.indexOf('if(action===\"SELECT_OPEN\")jhStage61PreparedPick56.delete(routeToken);')<\n"
              "   helper.indexOf('const record=await jhStage61Host56.record({routeToken'),\n"
              "   'every re-open clears stale prepared refs before receipt inspection');"
          )
          after = (
              " const helper=helperFromPatched(patched);\n"
              " const afterBegin=helper.indexOf('async function jhStage61AfterAction56');\n"
              " const afterEnd=helper.indexOf('function jhStage61PrepareComputer56',afterBegin);\n"
              " const afterAction=helper.slice(afterBegin,afterEnd);\n"
              " assert.ok(afterBegin>=0&&afterEnd>afterBegin,'after-action helper must be bounded');\n"
              " assert.ok(afterAction.indexOf('if(action===\"SELECT_OPEN\")jhStage61PreparedPick56.delete(routeToken);')<\n"
              "   afterAction.indexOf('const record=await jhStage61Host56.record({routeToken'),\n"
              "   'every re-open clears stale prepared refs before its receipt inspection');"
          )
          if source.count(before) != 1:
              raise SystemExit('STAGE63_TEST_SCOPE_ANCHOR_MISMATCH')
          source = source.replace(before, after)

          before = " const built=await buildStage25PendingOperatorEntrypoint56(ROOT,env);"
          after = (
              " const previous=new Map(Object.keys(env).map(key=>[key,process.env[key]]));\n"
              " let built;\n"
              " try{\n"
              "  for(const [key,value] of Object.entries(env))process.env[key]=value;\n"
              "  built=await buildStage25PendingOperatorEntrypoint56(ROOT,env);\n"
              " }finally{\n"
              "  for(const [key,value] of previous){\n"
              "   if(value===undefined)delete process.env[key];else process.env[key]=value;\n"
              "  }\n"
              " }"
          )
          if source.count(before) != 1:
              raise SystemExit('STAGE63_ENVIRONMENT_ANCHOR_MISMATCH')
          test_path.write_text(source.replace(before, after), encoding='utf-8')

          stage25 = Path('jh-server/owner-setup/jh168-mobile-unification/stage25-live-operator-followup-entry.mjs')
          source = stage25.read_text(encoding='utf-8')
          before = "    (stage40 && (runtime.split('jhOwnerAdmissionNote40(').length!==3||\n      runtime.split('jhOwnerAdmissionTake40(').length!==3))||"
          after = "    (stage40 && (runtime.split('jhOwnerAdmissionNote40(').length!==(stage61?4:3)||\n      runtime.split('jhOwnerAdmissionTake40(').length!==3))||"
          if source.count(before) != 1:
              raise SystemExit('STAGE25_STAGE63_COUNT_ANCHOR_MISMATCH')
          stage25.write_text(source.replace(before, after), encoding='utf-8')
          PY
          git diff --check
          git diff --stat | tee /tmp/stage63-diff-stat.txt

      - name: Syntax-check changed sources
        shell: bash
        run: |
          set -euo pipefail
          node --check jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/stage25-live-operator-followup-entry.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs

      - name: Run targeted Stage63 test
        shell: bash
        run: |
          set -o pipefail
          node --test \
            jh-server/owner-setup/jh168-mobile-unification/stage63-native-select-owner-admission.test.mjs \
            2>&1 | tee /tmp/stage63-targeted-test.log

      - name: Run related mobile and owner-admission regressions
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 \
            jh-server/owner-setup/jh168-mobile-unification/stage25-live-operator-followup-entry.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage40-owner-admission-diagnostics.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage41-command-lifecycle.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage42-protected-source-provenance.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage44-device-focus.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-mobile-runtime-patch.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-current-source-compat.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-host-adapter.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage61-right-pane-router.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/mobile-web-tool-patch.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/mobile-web-current-main-compat.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/mobile13-command-diagnostics.test.mjs \
            2>&1 | tee /tmp/stage63-regression-test.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jh168-stage63-validation-evidence
          path: |
            /tmp/stage63-diff-stat.txt
            /tmp/stage63-targeted-test.log
            /tmp/stage63-regression-test.log
          if-no-files-found: warn
          retention-days: 7

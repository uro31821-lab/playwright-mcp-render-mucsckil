name: JH Fold8 OCR — real Durable offline CI
on:
  pull_request:
    branches:
      - jh-fix3-secure-server
    paths:
      - 'jh-server/owner-setup/deployment/durable-clean-restart-release.mjs'
      - 'jh-server/owner-setup/deployment/jh167-durable-ocr-review-patch*'
      - 'jh-server/owner-setup/server-integration/jh-visual-ocr-*.mjs'
      - 'jh-server/owner-setup/server-integration/tests/jh-visual-ocr-review.test.mjs'
      - '.github/workflows/jh-fold8-ocr-review.yml'
permissions:
  contents: read
jobs:
  actual-durable-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned Owner source without app startup or secrets
        run: node jh-server/owner-setup/verification/build-owner-runtime.mjs
      - name: Generate verified Unified baseline
        run: node jh-server/owner-setup/deployment/unified-runtime-build.mjs
      - name: Generate verified Functional baseline
        run: |
          cd jh-server/owner-setup
          node --input-type=module -e 'import {assertFunctionalReleaseRuntime} from "./deployment/functional-release-runtime.mjs"; console.log(assertFunctionalReleaseRuntime(process.cwd()));'
      - name: Install pinned Owner and enrollment dependencies (no lifecycle scripts)
        run: |
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: Test actual Durable Clean Restart source generation, default-off rollback, native OCR review evidence
        run: |
          cd jh-server/owner-setup
          node --test deployment/jh167-durable-ocr-review-patch.test.mjs server-integration/tests/jh-visual-ocr-review.test.mjs
      - name: Existing G3-G12 real Durable/security/guide regression suite (read-only CI)
        run: |
          node --test jh-server/owner-setup/deployment/jh167-operational-guide-reservation-patch.test.mjs
          node --test jh-server/owner-setup/deployment/jh167-g4-isolated-mcp.test.mjs
          node --test jh-server/owner-setup/deployment/jh167-g5-loopback-http.test.mjs
          node --test jh-server/owner-setup/deployment/jh167-g6-real-durable-host.test.mjs
          node --test jh-server/verification/durable-live-release.test.mjs
          node --test jh-server/verification/jh167-split-session-durable-read.test.mjs jh-server/verification/durable-computer-policy.test.mjs
          node --test jh-server/verification/trusted-process-runtime.test.mjs
          node --test jh-server/owner-setup/deployment/jh167-g10-guide-current-evidence.test.mjs
          node --test jh-server/owner-setup/guide-13/jh167-g11-source-first-news.test.mjs
          node --test jh-server/owner-setup/guide-13/jh167-g12-signed-article-identity.test.mjs
      - name: Actual authenticated Durable MCP loopback (synthetic keys, no devices)
        run: |
          cd jh-server/owner-setup
          node --test deployment/jh167-ocr-real-durable-http.test.mjs
      - name: Syntax and protected owner identity
        run: |
          cd jh-server/owner-setup
          node --check deployment/durable-clean-restart-release.mjs
          node --check deployment/jh167-durable-ocr-review-patch.mjs
          node --check server-integration/jh-visual-ocr-split-proof.mjs
          node --check server-integration/jh-visual-ocr-review-bridge.mjs
          node --check server-integration/server-durable-native-return-route56.mjs
      - name: Verify production Owner baseline still untouched
        run: |
          cd jh-server/owner-setup
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {createHash} from "node:crypto"; const s=readFileSync("./deployment/owner-service-entry.mjs"); const b=createHash("sha1").update("blob "+s.length+"\0").update(s).digest("hex"); if(b!=="de6022b1a9b984cfa46e3be5f96093966d5a1ff2")process.exit(1);'

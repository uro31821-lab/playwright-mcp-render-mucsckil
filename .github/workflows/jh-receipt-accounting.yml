name: JH delivery receipt accounting
on:
  push:
    branches: ['jh/receipt-accounting-v2-20261009','jh-fix3-secure-server']
    paths: ['jh-server/**','.github/workflows/jh-receipt-accounting.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Preserve dependency and startup checks
        working-directory: jh-server
        run: npm install --no-audit --no-fund
      - name: Delivery receipts and unchanged trust enforcement
        working-directory: jh-server
        run: node --test owner-setup/trusted-server/dispatch-receipts*.test.mjs owner-setup/trusted-server/trusted-device-registry.test.mjs owner-setup/trusted-server/trusted-bridge-session-authority.test.mjs owner-setup/trusted-server/trusted-recovery.test.mjs owner-setup/trusted-server/trusted-renewal.test.mjs owner-setup/owner-enrollment/owner-bootstrap.test.mjs

name: JHAI Ebiseo Assistance

on:
  pull_request:
    branches: ['jh-fix3-secure-server']
    paths:
      - 'host-ebiseo-assist/**'
      - 'host-personal-dialogue/**'
      - 'host-personalization/**'
      - 'host-decision-learning/**'
      - '.github/workflows/jhai-ebiseo-assist.yml'
  push:
    branches: ['jh-fix3-secure-server']
    paths:
      - 'host-ebiseo-assist/**'
      - '.github/workflows/jhai-ebiseo-assist.yml'

permissions:
  contents: read

concurrency:
  group: jhai-ebiseo-assist-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Current-task consultation and existing runtime regressions
        run: node --test host-ebiseo-assist/*.test.mjs host-personal-dialogue/*.test.mjs host-personalization/*.test.mjs host-decision-learning/*.test.mjs

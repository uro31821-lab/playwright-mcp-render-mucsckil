name: JH one-pass updater Windows verification
on:
  push:
    branches: [jh-onepass-updater-check-20261004]
    paths: ['jh-updater-verification/**', '.github/workflows/jh-onepass-updater-verification.yml']
permissions:
  contents: read
concurrency:
  group: jh-onepass-updater-verification
  cancel-in-progress: false
jobs:
  windows-updater:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Read only generic test sources at this exact commit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path tests,test-output | Out-Null
          $files = @{
            'JH.Update.Core.ps1' = 'aad38e0f4b95df889756118a0f8c3aa41075d3a70cf998aef18ec90d1c30b63d'
            'Test-OnePass.ps1' = 'eecafc63fe3eca1129f42dd0549a3c53e3414171f0f068766dbdabb03d832b7c'
            'Run-OnePass.ps1' = 'afe5e0e01fdfb99448cba4466c75ab0271ddf96e98f2c508e3e424d9aed10ed0'
            'Bootstrap.template.cmd' = 'cb0699d1811c3f872877689c4381c22edacad873368893af4b1ccad62a043b54'
            'Test-Bootstrap.ps1' = 'c5e98d1ceb33484439ae6e7a1e2ec16da4f8c697a3a753b20d59595a6772b844'
          }
          foreach ($name in $files.Keys) {
            $url = 'https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/jh-updater-verification/' + $name
            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile (Join-Path tests $name)
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path tests $name)).Hash.ToLowerInvariant()
            if ($hash -cne $files[$name]) { throw ('Exact source checksum mismatch: ' + $name) }
          }
          $files | ConvertTo-Json | Set-Content test-output/source-hashes.json -Encoding UTF8
      - name: Test Windows native quoting, APK guards and actual updater flow with synthetic tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          & .\tests\Test-OnePass.ps1 -OutputDirectory (Join-Path $PWD test-output) *>&1 | Tee-Object -FilePath test-output/windows-test.log
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute actual cmd bootstrap and entrypoint using synthetic payloads
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Test-Bootstrap.ps1 -OutputDirectory (Join-Path $PWD test-output) *>&1 | Tee-Object -FilePath test-output/bootstrap-test.log
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve test evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jh-onepass-windows-test-evidence
          path: test-output/
          if-no-files-found: warn
          retention-days: 7

name: JH trusted session renewal check
on:
  push:
    branches: ['jh/automatic-session-20261009','jh-fix3-secure-server']
    paths: ['jh-server/**','.github/workflows/jh-trusted-renewal-check.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Preserved host dependency installation and postinstall checks
        working-directory: jh-server
        run: npm install --no-audit --no-fund
      - name: Real device-key and session-MAC renewal tests
        working-directory: jh-server
        run: node --test owner-setup/trusted-server/trusted-renewal.test.mjs
      - name: Preserved normal server startup
        working-directory: jh-server
        shell: bash
        run: |
          set -euo pipefail
          PORT=18762 PUBLIC_BASE_URL=https://jh-secure-bridge-fix4.onrender.com LIFE_HUB_TOKEN=JH_CI_SYNTHETIC_ONLY_TOKEN_1234567890 npm start > /tmp/jh-renewal-start.log 2>&1 &
          P=$!
          trap 'kill "$P" 2>/dev/null || true' EXIT
          for n in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:18762/health > /tmp/jh-renewal-health.json; then break; fi
            kill -0 "$P"
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:18762/health
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18762/mcp)
          test "$code" = 401
          echo TRUSTED_RENEWAL_RELEASE_PASS

name: JH secure session stale job fence
on:
  push:
    branches: ['jh-session-queued-fence-20261010']
    paths:
      - 'jh-server/owner-setup/deployment/native-readback.mjs'
      - 'jh-server/verification/session-fence-e2e.mjs'
      - '.github/workflows/jh-session-queued-fence.yml'
permissions:
  contents: read
jobs:
  signed-secure-fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Setup and preserved authenticated server tests
        working-directory: jh-server
        run: npm install --no-audit --no-fund
      - name: Syntax
        working-directory: jh-server
        run: |
          node --check owner-setup/deployment/native-readback.mjs
          node --check verification/session-fence-e2e.mjs
      - name: Exact old/new secure HTTP register activate poll and completion tests
        working-directory: jh-server
        run: timeout 120s node verification/session-fence-e2e.mjs
      - name: Preserve trusted session and delivery receipts
        working-directory: jh-server
        run: node --test owner-setup/trusted-server/dispatch-receipts*.test.mjs owner-setup/trusted-server/trusted-renewal.test.mjs
      - name: Immutable protected startup and original runtime
        run: |
          git diff --exit-code 8053f79cae798c557b0f5fbb8c309444cb3d03a2 -- jh-server/server.mjs jh-server/auth-diagnostics-entry.mjs jh-server/owner-setup/server-integration jh-server/owner-setup/browser-live jh-server/owner-setup/trusted-server jh-server/owner-setup/deployment/functional-release-runtime.mjs jh-server/owner-setup/deployment/owner-service-entry.mjs jh-server/owner-setup/deployment/operational-service-entry.mjs
      - run: echo JH_SECURE_SESSION_FENCE_VERIFIED

name: JH168 Stage29 owner-journal restart receipt (source-only)
on:
  pull_request:
    branches: ['jh-fix3-secure-server']
    paths:
      - 'jh-server/owner-setup/jh168-mobile-unification/stage29-*'
      - '.github/workflows/jh168-stage29-receipt-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage29-original-owner-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Prove existing Secure56 server, Android and original journal source are unchanged
        run: |
          git diff --exit-code origin/jh-fix3-secure-server -- \
            jh-server/server.mjs \
            jh-server/owner-setup/deployment \
            jh-server/owner-setup/server-integration \
            jh-server/owner-setup/android-direct \
            jh-server/owner-setup/trusted-server \
            jh-server/owner-setup/jh168-mobile-unification/stage26-completion-delivery-policy.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage26-completion-delivery-patch.mjs
      - name: Verify syntax and run Stage28 controlled transport tests (no external network)
        run: |
          node --check jh-server/owner-setup/jh168-mobile-unification/stage29-durable-completion-readback.mjs
          node --check jh-server/owner-setup/jh168-mobile-unification/stage29-durable-completion-readback.test.mjs
          node --test --test-reporter=spec \
            jh-server/owner-setup/jh168-mobile-unification/stage29-durable-completion-readback.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/stage28-transport-recovery.test.mjs \
            jh-server/owner-setup/jh168-mobile-unification/split-followup-receipts.test.mjs
      - name: Verify prior Secure56 signed completion, original pending approval and journal integration
        env:
          CI: 'true'
          NODE_ENV: test
          JH_OWNER_DEFER_LISTEN: '1'
        run: |
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund --package-lock=false
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
          node --test --test-reporter=spec \
            jh-server/owner-setup/jh168-mobile-unification/stage26-completion-delivery.test.mjs \
            jh-server/owner-setup/server-integration/pending-approval-receipt-patch.test.mjs \
            jh-server/verification/durable-owner-storage.test.mjs
      - name: Release boundary
        run: |
          echo JH_STAGE29_SOURCE_ONLY=YES
          echo OWNER_VOLUME_MIGRATION=NOT_RUN
          echo LIVE_RESTART_E2E=NOT_RUN
          echo DEVICE_ACTIONS=0
          echo APK_UPDATE=0
          echo RENDER_DEPLOY=0

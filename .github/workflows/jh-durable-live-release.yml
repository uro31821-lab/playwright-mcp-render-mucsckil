name: JH durable live release gate
on:
  push:
    branches: ['jh-durable-live-release-20261010']
    paths:
      - 'jh-server/owner-setup/deployment/durable-live-release.mjs'
      - 'jh-server/owner-setup/deployment/published-host-router.mjs'
      - 'jh-server/verification/durable-live-release.test.mjs'
      - '.github/workflows/jh-durable-live-release.yml'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Original authentication, connection and deadline regressions
        working-directory: jh-server
        run: npm install --no-audit --no-fund
      - name: Actual release composition, first activation and verify-only second boot
        working-directory: jh-server
        run: |
          node --check owner-setup/deployment/durable-live-release.mjs
          node --check owner-setup/deployment/published-host-router.mjs
          node --test verification/durable-live-release.test.mjs
      - name: Owner storage, historical cutover and Computer Use classifications
        working-directory: jh-server
        run: node --test verification/durable-cutover.test.mjs verification/durable-computer-policy.test.mjs verification/durable-owner-storage.test.mjs
      - name: Persistent journal and actual signed HTTP through hard restarts
        working-directory: jh-server
        run: |
          node verification/durable-manual-fence-process.test.mjs
          timeout 180s node verification/durable-computer-http.mjs
      - name: Original trusted completion and renewal regression
        working-directory: jh-server
        run: node --test owner-setup/trusted-server/dispatch-receipts*.test.mjs owner-setup/trusted-server/trusted-renewal.test.mjs
      - name: Protected original operational entry, runtime, account and storage unchanged
        run: |
          git diff --exit-code 4698e81f32bb785dd30a9360ec60c54ad58ab87c -- jh-server/server.mjs jh-server/auth-diagnostics-entry.mjs jh-server/owner-setup/server-integration jh-server/owner-setup/browser-live jh-server/owner-setup/trusted-server jh-server/owner-setup/owner-enrollment jh-server/owner-setup/deployment/native-readback.mjs jh-server/owner-setup/deployment/functional-release-runtime.mjs jh-server/owner-setup/deployment/owner-service-entry.mjs jh-server/owner-setup/deployment/operational-service-entry.mjs jh-server/owner-setup/deployment/owner-storage.mjs jh-server/owner-setup/deployment/owner-config.mjs
      - run: echo JH_DURABLE_LIVE_RELEASE_GATE_PASS

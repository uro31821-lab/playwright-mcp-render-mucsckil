name: JH Kabiseo published CameraX API surface diff (no app build)
on:
  push:
    branches: [kabiseo-native-camera-v023-20261107]
    paths:
      - 'tools/kabiseo-public-camerax-abi/**'
      - '.github/workflows/jh-kabiseo-public-camerax-abi.yml'
permissions: {contents: read}
jobs:
  inspect-public-only:
    runs-on: windows-2025
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false}
      - name: Ensure existing private JH and previous test corpus unchanged
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 18579971d0ddbf4847e8c39005233e2d8e3f8e86
          if($LASTEXITCODE){exit $LASTEXITCODE}
          git diff --exit-code 18579971d0ddbf4847e8c39005233e2d8e3f8e86 HEAD -- jh-server host-kabiseo-assist tools/kabiseo-abi-review tools/kabiseo-dependency-review tools/kabiseo-maven-graph tools/kabiseo-model-provenance
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Compare classfiles statically only, never load/execute them
        shell: pwsh
        run: |
          python tools/kabiseo-public-camerax-abi/inspect.py
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Defender scan vendor files in quarantine with security on
        if: always()
        shell: pwsh
        run: |
          $root=Join-Path $env:GITHUB_WORKSPACE 'kabiseo-public-camerax-abi'
          $scan=Join-Path $root 'quarantine'
          $r=[ordered]@{status='NOT_SCANNED';securityChanged=$false;releaseApproved=$false}
          try {
            $files=@(Get-ChildItem $scan -File -ErrorAction SilentlyContinue)
            if($files.Count -gt 0){
              $s=Get-MpComputerStatus -ErrorAction Stop
              $exe=Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" -ErrorAction SilentlyContinue|Sort-Object FullName -Descending|Select-Object -First 1
              if($s.AntivirusEnabled -and $exe){
                & $exe.FullName -Scan -ScanType 3 -File $scan -DisableRemediation *> (Join-Path $root 'defender.log')
                $r.scanExitCode=$LASTEXITCODE
                $r.status=if($LASTEXITCODE -eq 0){'SCAN_COMPLETED_NO_THREAT_REPORTED'}else{'SCAN_FAILED_OR_THREAT_REPORTED'}
                $r.avDefinition=$s.AntivirusSignatureVersion
              }else{$r.status='DEFENDER_UNAVAILABLE'}
            }
          }catch{$r.status='SCAN_UNAVAILABLE';$r.errorType=$_.Exception.GetType().Name}
          $r | ConvertTo-Json | Set-Content (Join-Path $root 'antivirus.json') -Encoding utf8
          Write-Host ('CAMERAX_AV='+($r|ConvertTo-Json -Compress))
          exit 0
      - name: Verify no source/app build or approval scope expansion
        shell: pwsh
        run: |
          $r=Get-Content kabiseo-public-camerax-abi/report.json -Raw|ConvertFrom-Json
          if($r.schema -ne 'KABISEO_PUBLIC_CAMERAX142_V152_API_V034' -or $r.securityGateVerdict -ne 'REVIEW' -or $r.releaseApproved){throw 'UNAUTHORIZED_RELEASE'}
          if($r.privateSourceRead -or $r.androidAppBuilt -or $r.vendorBytecodeExecuted -or $r.privateAppExactUsageVerified){throw 'INVALID_SCOPE'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kabiseo-public-camerax-abi-v034
          path: |
            kabiseo-public-camerax-abi/report.json
            kabiseo-public-camerax-abi/antivirus.json
            kabiseo-public-camerax-abi/defender.log
          retention-days: 14
          if-no-files-found: warn

name: JH168 current-live source overlay compatibility (NO RELEASE)
on:
  pull_request:
    branches: [jh-fix3-secure-server]
    paths:
      - 'jh-server/owner-setup/jh168-mobile-unification/stage28-*'
      - 'jh-server/owner-setup/jh168-mobile-unification/stage29-*'
      - 'jh-server/owner-setup/jh168-mobile-unification/stage30-*'
      - 'jh-server/owner-setup/jh168-mobile-unification/stage31-*'
      - 'jh-server/owner-setup/jh168-mobile-unification/stage32-*'
      - 'jh-server/owner-setup/jh168-mobile-unification/stage33-*'
      - 'jh-server/owner-setup/jh168-mobile-unification/stage34-*'
      - 'jh-server/owner-setup/jh168-mobile-unification/stage35-*'
      - 'jh-server/owner-setup/jh168-mobile-unification/stage36-*'
      - 'jh-server/owner-setup/jh168-mobile-unification/stage37-*'
      - '.github/workflows/jh168-current-live-overlay-compat.yml'
permissions:
  contents: read
jobs:
  immutable-live-source-no-phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      MAIN_SHA: '2c310f8b4a76d40604416e7dd4cb4976fdd1fc85'
      LIVE_SHA: '4c71890021fc299838e6a8ce45ccf5f64712f354'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Pin actual observed live SHA and verify zero overlapping changed paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/jh-fix3-secure-server)" = "$MAIN_SHA"
          git cat-file -e "$LIVE_SHA^{commit}" || git fetch --no-tags origin "$LIVE_SHA"
          git merge-base --is-ancestor "$MAIN_SHA" "$LIVE_SHA"
          git merge-base --is-ancestor "$MAIN_SHA" HEAD
          git diff --name-only "$MAIN_SHA" "$LIVE_SHA" | sort > "$RUNNER_TEMP/live-paths"
          git diff --name-only "$MAIN_SHA" HEAD | sort > "$RUNNER_TEMP/candidate-paths"
          test "$(wc -l < "$RUNNER_TEMP/candidate-paths")" -eq 42
          if comm -12 "$RUNNER_TEMP/live-paths" "$RUNNER_TEMP/candidate-paths" | grep -q .; then
            echo STAGE38_LIVE_OVERLAY_FILE_COLLISION=BLOCKED
            exit 1
          fi
          git diff --quiet "$MAIN_SHA" HEAD -- jh-server/server.mjs jh-server/owner-setup/deployment jh-server/owner-setup/server-integration jh-server/owner-setup/android-direct jh-server/owner-setup/trusted-server jh-server/owner-setup/owner-enrollment jh-server/owner-setup/operational-learning
          echo STAGE38_SOURCE_PATH_COLLISIONS=0
          echo STAGE38_ORIGINAL_RUNTIME_DIFF=0
      - name: Construct synthetic worktree from exact observed Render live commit
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY="$RUNNER_TEMP/jh168-live-synthetic"
          git worktree add --detach "$OVERLAY" "$LIVE_SHA"
          while IFS= read -r f; do
            case "$f" in
              jh-server/owner-setup/jh168-mobile-unification/*|.github/workflows/jh168-one-release-candidate-current-main.yml|.github/workflows/jh168-current-live-overlay-compat.yml) ;;
              *) echo "UNEXPECTED_SOURCE_PATH=$f"; exit 1 ;;
            esac
            mkdir -p "$OVERLAY/$(dirname "$f")"
            git show "HEAD:$f" > "$OVERLAY/$f"
            cmp "$OVERLAY/$f" <(git show "HEAD:$f")
          done < "$RUNNER_TEMP/candidate-paths"
          git -C "$OVERLAY" diff --quiet "$LIVE_SHA" -- jh-server/server.mjs jh-server/owner-setup/deployment jh-server/owner-setup/server-integration jh-server/owner-setup/operational-learning
          echo STAGE38_OVERLAY_ORIGINAL_LIVE_RUNTIME_UNCHANGED=YES
      - name: Install same pinned Node/owner dependencies in disposable overlay
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/jh168-live-synthetic"
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund --package-lock=false
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: Serial original-result receipt + crash/no-replay tests against live source
        shell: bash
        env:
          CI: 'true'
          NODE_ENV: test
          JH_OWNER_DEFER_LISTEN: '1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/jh168-live-synthetic"
          ROOT=jh-server/owner-setup/jh168-mobile-unification
          node --test --test-reporter=spec "$ROOT/stage28-transport-recovery.test.mjs" "$ROOT/split-followup-receipts.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage29-durable-completion-readback.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage30-atomic-host-integration.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage31-offline-owner-addon.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage32-release-gates.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage34-original-receipt-reader.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage35-sealed-reference.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage36-inline-original-handoff.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage36-original-signed-flow.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage37-client-delivery-e2e.test.mjs"
      - name: Serial actual generated Secure56 operator and MOBILE 9+4 source checks
        shell: bash
        env:
          CI: 'true'
          NODE_ENV: test
          JH_OWNER_DEFER_LISTEN: '1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/jh168-live-synthetic"
          ROOT=jh-server/owner-setup/jh168-mobile-unification
          node --test --test-reporter=spec "$ROOT/stage30-generated-secure-runtime.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage34-generated-original-operator.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage35-generated-operator.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage36-generated-original-operator.test.mjs"
          node --test --test-reporter=spec "$ROOT/stage26-completion-delivery.test.mjs"
          node --test --test-reporter=spec jh-server/owner-setup/server-integration/pending-approval-receipt-patch.test.mjs
          node --test --test-reporter=spec jh-server/verification/durable-owner-storage.test.mjs
          node --test --test-reporter=spec "$ROOT/mobile-web-current-main-compat.test.mjs"
          node --test --test-reporter=spec "$ROOT/mobile-web-stage25-operator.test.mjs"
          node --test --test-reporter=spec "$ROOT/mobile-web-13-runtime-contract.test.mjs"
      - name: Outcome boundary and live-only facts not present in GitHub
        run: |
          echo STAGE38_SOURCE_OVERLAY_ONLY=YES
          echo STAGE38_ORIGINAL_COMMAND_REPLAY=0
          echo STAGE38_RENDER_DEPLOY=0
          echo STAGE38_OWNER_SQLITE_MIGRATION=0
          echo STAGE38_OWNER_LIVE_OUTCOME_UNKNOWN_COUNT=NOT_OBSERVED
          echo STAGE38_OWNER_LIVE_DISK_FREE=NOT_OBSERVED
          echo STAGE38_CURRENT_LIVE_SHA_REFRESH_REQUIRED_BEFORE_RELEASE=YES
          echo STAGE38_REAL_PHONE_E2E=NOT_RUN
          echo STAGE38_PRODUCTION_ACTIVATION=BLOCKED

name: JH Stage69 final mobile routing
on:
  pull_request:
    branches: [jh-fix3-secure-server]
    paths:
      - 'jh-mobile-dual-engine/stage67/**'
      - 'jh-mobile-dual-engine/stage69/**'
      - '.github/workflows/jh-stage67-dual-engine.yml'
permissions: {contents: read}
jobs:
  final-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test --test-reporter=spec jh-mobile-dual-engine/stage67/stage67-dual-engine.test.mjs
      - run: node --test --test-reporter=spec jh-mobile-dual-engine/stage69/final-state.test.mjs
  playwright-provider-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node jh-mobile-dual-engine/stage67/playwright-mobile/provider-probe.mjs

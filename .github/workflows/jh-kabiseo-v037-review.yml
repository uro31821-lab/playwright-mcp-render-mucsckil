name: JH Kabiseo 75 pinned public Maven binaries security data-only
on:
  push:
    branches: [kabiseo-native-camera-v023-20261107]
    paths:
      - 'tools/kabiseo-v037-review/**'
      - '.github/workflows/jh-kabiseo-v037-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  inspect-no-build:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false}
      - name: Assert previous project unchanged
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 066976843c9e2d5977e9db1952cae4310e92994e
          if($LASTEXITCODE){exit $LASTEXITCODE}
          git diff --exit-code 066976843c9e2d5977e9db1952cae4310e92994e HEAD -- jh-server host-kabiseo-assist tools/kabiseo-detached-graph tools/kabiseo-abi-review
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Reuse exact pinned public graph artifact and read published binaries as data
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/kabiseo-v037-review/inspect.py
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Scan all downloaded AAR JAR and SO without disabling Defender
        if: always()
        shell: pwsh
        run: |
          $root=Join-Path $env:GITHUB_WORKSPACE 'kabiseo-v037-review'
          New-Item -ItemType Directory $root -Force | Out-Null
          $scan=Join-Path $root 'quarantine'
          $r=[ordered]@{status='NOT_SCANNED';securityChanged=$false;releaseApproved=$false}
          try{
            $files=@(Get-ChildItem $scan -File -ErrorAction SilentlyContinue)
            $r.fileCount=$files.Count
            if($files.Count -gt 0){
              $s=Get-MpComputerStatus -ErrorAction Stop
              $mp=Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
              if($s.AntivirusEnabled -and $mp){
                & $mp.FullName -Scan -ScanType 3 -File $scan -DisableRemediation *> (Join-Path $root 'defender.log')
                $r.exitCode=$LASTEXITCODE
                $r.status=if($LASTEXITCODE -eq 0){'SCAN_COMPLETED_NO_THREAT_REPORTED'}else{'SCAN_FAILED_OR_THREAT_REPORTED'}
                $r.signatureVersion=$s.AntivirusSignatureVersion
              }else{$r.status='DEFENDER_UNAVAILABLE'}
            }
          }catch{$r.status='SCAN_UNAVAILABLE';$r.errorType=$_.Exception.GetType().Name}
          $r|ConvertTo-Json|Set-Content (Join-Path $root 'antivirus.json') -Encoding utf8
          Write-Host ('KABISEO_V037_AV='+($r|ConvertTo-Json -Compress))
          exit 0
      - name: Enforce review-only and no Android build
        shell: pwsh
        run: |
          $r=Get-Content kabiseo-v037-review/report.json -Raw|ConvertFrom-Json
          if($r.schema -ne 'KABISEO_DETACHED_75_BINARY_REVIEW_V037' -or $r.status -ne 'DETACHED_PUBLIC_BINARY_INPUTS_INSPECTED' -or $r.securityGateVerdict -ne 'REVIEW' -or $r.releaseApproved){throw 'INVALID_REPORT'}
          if($r.privateSourceRead -or $r.vendorCodeExecuted -or $r.appBuilt){throw 'SCOPE_VIOLATION'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kabiseo-v037-public-receipts-only
          path: |
            kabiseo-v037-review/report.json
            kabiseo-v037-review/antivirus.json
            kabiseo-v037-review/defender.log
          retention-days: 14
          if-no-files-found: warn

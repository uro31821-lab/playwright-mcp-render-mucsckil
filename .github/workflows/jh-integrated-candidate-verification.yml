name: JH integrated candidate verification
on:
  push:
    branches: [jh-integrated-verification-20261004]
    paths:
      - jh-server/verification/**
      - .github/workflows/jh-integrated-candidate-verification.yml
permissions:
  contents: read
concurrency:
  group: jh-integrated-candidate-verification
  cancel-in-progress: false
jobs:
  server-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read public source at the triggering commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jh-isolated"
          cd "$RUNNER_TEMP/jh-isolated"
          git init -q
          git remote add origin https://github.com/uro31821-lab/playwright-mcp-render-mucsckil.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Compare actual servers and rerun existing diagnostics tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/jh-isolated/jh-server"
          npm install --ignore-scripts --no-audit --no-fund
          node verification/build-auth-candidate.mjs
          node --check verification-output/candidate/server.mjs
          node --test verification/auth-rejection.test.mjs 2>&1 | tee verification-output/auth-test.log
          node --test connection-diagnostics.test.mjs 2>&1 | tee verification-output/existing-diagnostics-test.log
          git diff --exit-code -- server.mjs package.json
          printf 'TESTED SERVER CANDIDATE ONLY. No production deploy or phone changes. Android source/SDK not read by this job.\n' > verification-output/SCOPE.txt
      - name: Preserve bounded verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jh-integrated-server-candidate-evidence
          path: |
            ${{ runner.temp }}/jh-isolated/jh-server/verification-output/candidate/
            ${{ runner.temp }}/jh-isolated/jh-server/verification-output/candidate-identity.json
            ${{ runner.temp }}/jh-isolated/jh-server/verification-output/http-parity-results.json
            ${{ runner.temp }}/jh-isolated/jh-server/verification-output/*test.log
            ${{ runner.temp }}/jh-isolated/jh-server/verification-output/SCOPE.txt
          if-no-files-found: error
          retention-days: 7

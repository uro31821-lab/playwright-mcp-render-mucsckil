name: JH Secure completion 401 existing status compatibility
on:
  push:
    branches: ['jh-401-status-compat-20261010']
    paths:
      - 'jh-server/owner-setup/deployment/durable-native-runtime-candidate.mjs'
      - 'jh-server/verification/secure-complete-401-status-http.mjs'
      - '.github/workflows/jh-401-status-compat.yml'
permissions:
  contents: read
jobs:
  safe-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Original authentication and session regressions
        working-directory: jh-server
        run: npm install --no-audit --no-fund
      - name: Safely build candidate, no runtime changes beyond read-only status
        working-directory: jh-server
        run: |
          node --check owner-setup/deployment/durable-native-runtime-candidate.mjs
          node --check verification/secure-complete-401-status-http.mjs
          node --input-type=module -e 'import {buildDurableNativeRuntime} from "./owner-setup/deployment/durable-native-runtime-candidate.mjs"; import path from "node:path"; const r=buildDurableNativeRuntime(path.resolve("owner-setup")); if(r.diagnosticOnlyEdits!==3)process.exit(1);console.log("JH_STATUS_COMPAT_RUNTIME="+r.candidateSha256);'
      - name: Signed MCP existing life_status diagnostic and protected new tool parity
        working-directory: jh-server
        run: timeout 140s node verification/secure-complete-401-status-http.mjs
      - name: Existing first cutover and operational startup
        working-directory: jh-server
        run: node --test verification/durable-live-release.test.mjs verification/durable-cutover.test.mjs
      - name: Authenticated completion receipts remain unchanged
        working-directory: jh-server
        run: node --test owner-setup/trusted-server/dispatch-receipts*.test.mjs owner-setup/trusted-server/trusted-renewal.test.mjs
      - name: No auth, Android, enrollment, Life, or persistent storage edits
        run: |
          git diff --exit-code cf5bc5aec3366aed5c32d04b9798355ceaa9fbdf -- jh-server/server.mjs jh-server/auth-diagnostics-entry.mjs jh-server/owner-setup/server-integration jh-server/owner-setup/trusted-server jh-server/owner-setup/owner-enrollment jh-server/owner-setup/deployment/native-readback.mjs jh-server/owner-setup/deployment/durable-live-release.mjs jh-server/owner-setup/deployment/durable-manual-circuit-fence.mjs jh-server/owner-setup/deployment/secure-complete-401-audit.mjs
      - run: echo JH_EXISTING_LIFE_STATUS_401_VERIFIED

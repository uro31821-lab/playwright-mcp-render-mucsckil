name: JH167 article V4 isolated boot - review only
on:
  pull_request:
    branches: ['jh-fix3-secure-server']
    paths:
      - '.github/workflows/jh167-article-v4-isolated-boot.yml'
      - 'jh-server/owner-setup/guide-13/article-*.mjs'
      - 'jh-server/owner-setup/deployment/jh167-article-*.mjs'
      - 'jh-server/owner-setup/deployment/durable-clean-restart-news-review-entry.mjs'
      - 'jh-server/owner-setup/deployment/jh167-news-v4-real-boot.test.mjs'
      - 'jh-server/owner-setup/deployment/jh167-news-v6-synthetic-handoff.test.mjs'
      - 'jh-server/owner-setup/deployment/jh167-chrome-url-evidence-patch.mjs'
      - 'jh-server/owner-setup/guide-13/chrome-address-evidence.mjs'
      - 'jh-server/owner-setup/guide-13/current-article.mjs'
      - 'jh-server/owner-setup/guide-13/jh167-v8-chrome-address-evidence.test.mjs'
permissions:
  contents: read
jobs:
  synthetic-owner-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: Install existing dependencies without postinstall
        run: |
          npm install --prefix jh-server --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup --ignore-scripts --no-audit --no-fund
          npm ci --prefix jh-server/owner-setup/owner-enrollment --ignore-scripts --no-audit --no-fund
      - name: Inspect existing original G6 synthetic boot path
        run: node --test --test-concurrency=1 jh-server/owner-setup/deployment/jh167-g6-real-durable-host.test.mjs
      - name: V4 synthetic full server boot and real MCP tools list
        run: node --test --test-concurrency=1 jh-server/owner-setup/deployment/jh167-news-v4-real-boot.test.mjs
      - name: V8 trusted Chrome native URL-bar evidence — fail closed
        run: node --test --test-concurrency=1 jh-server/owner-setup/guide-13/jh167-v8-chrome-address-evidence.test.mjs
      - name: V6 synthetic signed-article original-source MCP handoff
        run: timeout --signal=TERM 45s node --test --test-concurrency=1 jh-server/owner-setup/deployment/jh167-news-v6-synthetic-handoff.test.mjs

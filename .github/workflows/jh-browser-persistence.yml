name: JH real-browser persistence diagnosis
on:
  push:
    branches: ['jh/browser-persistence-20261007']
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read exact public source without credentials
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Install existing client dependencies
        working-directory: jh-server
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Start separate copies of deployed browser image
        run: |
          docker pull mcr.microsoft.com/playwright/mcp@sha256:3d871c22ea2d4cca0966e2cfb1860e1cb03eb7353725a3d6cffd133296fb04eb
          for port in 18931 18933; do
            docker run -d --name jh-browser-$port --network host --entrypoint node mcr.microsoft.com/playwright/mcp@sha256:3d871c22ea2d4cca0966e2cfb1860e1cb03eb7353725a3d6cffd133296fb04eb /app/cli.js --headless --browser chromium --no-sandbox --host 127.0.0.1 --port $port --allowed-hosts 127.0.0.1:$port
            for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:$port/mcp && break; sleep 1; done
          done
      - name: Compare current client and official SDK using real Chromium
        working-directory: jh-server
        run: timeout 120 node browser-persistence-probe.mjs
      - name: Inspect installed heartbeat and stop test containers
        if: always()
        run: |
          docker exec jh-browser-18931 node -e 'const fs=require("fs");function walk(p){for(const x of fs.readdirSync(p,{withFileTypes:true})){const f=p+"/"+x.name;if(x.isDirectory())walk(f);else if(x.isFile()&&f.endsWith(".js")){const s=fs.readFileSync(f,"utf8"),i=s.indexOf("ping timeout");if(i>=0&&s.includes("startHeartbeat"))console.log(f+"\n"+s.slice(Math.max(0,i-900),i+500));}}}walk("/app");' || true
          docker rm -f jh-browser-18931 jh-browser-18933 || true

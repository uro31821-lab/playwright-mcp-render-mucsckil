name: JH real-browser persistence diagnosis
on:
  push:
    branches: ['jh/browser-persistence-20261007']
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read exact public source without credentials
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Install existing client dependencies
        working-directory: jh-server
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run unchanged security checks and new event channel tests
        working-directory: jh-server
        run: |
          set -o pipefail
          node verification/build-auth-candidate.mjs
          node --test connection-diagnostics.test.mjs verification/auth-rejection.test.mjs verification/job-deadline.test.mjs browser-framing.test.mjs browser-session.test.mjs browser-session-entry.test.mjs browser-events.test.mjs | tee events-checks.tap
      - name: Start separate copies of deployed browser image
        run: |
          docker pull mcr.microsoft.com/playwright/mcp@sha256:3d871c22ea2d4cca0966e2cfb1860e1cb03eb7353725a3d6cffd133296fb04eb
          for port in 18931 18933 18935; do
            docker run -d --name jh-browser-$port --network host --entrypoint node mcr.microsoft.com/playwright/mcp@sha256:3d871c22ea2d4cca0966e2cfb1860e1cb03eb7353725a3d6cffd133296fb04eb /app/cli.js --headless --browser chromium --no-sandbox --host 127.0.0.1 --port $port --allowed-hosts 127.0.0.1:$port
            for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:$port/mcp && break; sleep 1; done
          done
      - name: Reproduce original problem and verify SDK control
        working-directory: jh-server
        run: timeout 120 node browser-persistence-probe.mjs
      - name: Verify fixed transport with real Chromium beyond heartbeat deadlines
        working-directory: jh-server
        run: timeout 120 node browser-events-real.mjs
      - name: Stop test containers
        if: always()
        run: docker rm -f jh-browser-18931 jh-browser-18933 jh-browser-18935 || true

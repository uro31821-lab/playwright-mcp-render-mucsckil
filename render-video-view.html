<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JH 영상 전달</title><link rel="stylesheet" href="/video-transfer/view.css"><script src="/video-transfer/view.js" defer></script></head>
<body><main><p class="eyebrow">JH · GEMINI</p><h1>영상을 ChatGPT로</h1>
<p id="status" role="status" aria-live="polite">연결을 확인하고 있습니다.</p>
<section id="upload" hidden><p>Gemini에서 저장한 영상 하나를 선택하세요. 전송 후 다운로드 링크가 만들어집니다.</p>
<label class="picker">영상 선택<input id="file" type="file" accept="video/mp4,video/webm"></label>
<p id="filename"></p><button id="send" disabled>영상 보내기</button><progress id="progress" max="100" value="0" hidden></progress>
<p class="note">최대 64 MB · MP4 또는 WebM<br>선택한 파일만 전송합니다.</p></section>
<section id="result" hidden><h2>전달 준비 완료</h2><p id="details"></p>
<a id="download" class="button">영상 다운로드</a><button id="copy" class="secondary">링크 복사</button>
<p>ChatGPT로 돌아가 <strong>“영상 전송 완료”</strong>라고 알려주세요. 같은 작업에서 결과 링크를 확인할 수 있습니다.</p>
<p class="note" id="expiry"></p><p class="note">링크를 가진 사람은 영상을 받을 수 있습니다.</p></section>
<button id="refresh" class="secondary" hidden>전송 상태 다시 확인</button>
</main></body></html>
